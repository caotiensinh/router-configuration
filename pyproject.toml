[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "router-configuration"
version = "0.1.0.dev0"
description = "Clean-room network configuration control system"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
routerctl = "router_configuration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
