canonical_lookup_sequence:
- Resolve product by exact_model.
- Resolve raw hardware revision without sibling inference.
- Resolve region/market scope.
- Resolve firmware track and release.
- Resolve management mode and controller platform/tier/version.
- Build or locate target_scope.scope_key.
- Query observations by domain/fact_key and preserve multiple scoped values.
- Join evidence plus conflict disposition before any write decision.
- Apply limitation and lifecycle guards; fail closed on unresolved applicability.
do_not_flatten:
- hardware revision selectors
- region/portal locale
- firmware trains
- standalone/controller/cloud modes
- controller minimum versus recommendation
- conditional performance/power values
- source conflicts
- bundle/component identities
- revision-scoped lifecycle notices
