rules:
- Only official EOL/EOM/EOS notifications or TP-Link End of Life product lists may set lifecycle dates/status.
- Lifecycle is exact-model + hardware/revision + region scoped when the vendor notice is revision scoped.
- A revision-scoped EOS row does not make all revisions of the model EOS.
- Absence from the current product catalog is not proof of EOL.
- Presence in a current catalog, support page, compatibility list, or firmware download surface is not proof of CURRENT lifecycle
  status.
- Absence from the reviewed EOL list is not proof of CURRENT lifecycle status; use UNKNOWN unless separate official lifecycle
  evidence says otherwise.
- Legacy aliases and renamed identifiers are not lifecycle-equivalent unless TP-Link explicitly binds them.
- Replacement-product recommendations require explicit vendor evidence or must be labeled project recommendation rather than
  vendor fact.
