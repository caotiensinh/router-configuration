rules:
- Configure and verify loop-prevention before physically closing a redundant Layer-2 loop when loop risk exists.
- Global spanning-tree enable and intended participating-port enable are independent state and both must be verified where
  the applicable workflow requires both.
- Lower numeric bridge/port/instance priority means higher preference in the cited CLI/controller scopes; exact accepted values/defaults
  remain source scoped.
- Changing bridge priority, path cost, timers, MST mappings or protection flags can change live forwarding topology and requires
  production-write approval.
- Edge/portfast is only safe on positively verified edge/end-device ports; never infer it for uplinks, root, alternate, backup
  or unknown-role ports.
- Current Controller guidance states Loopback Detection and Spanning Tree may coexist on the device but not on the same port;
  treat same-port configuration as a conflict.
- MST region identity depends on region name, revision and VLAN-to-instance mapping; mismatches must never be silently accepted
  as one region.
- VLANs not mapped to an explicit MST instance are CIST-scoped only where the current Controller guidance documents that behavior.
- Operational PASS requires read-back of topology/port/instance state; successful command/UI acceptance alone is EXECUTED_UNVERIFIED.
- BPDU Guard on an edge port can drive the port to ERROR-PORT and require manual recovery according to the 2026 CLI guide.
- Preserve active management/control-plane reachability before any topology-changing mutation.
- LAG/LACP creation is deferred to 4.10; STP configuration on an existing port-channel does not authorize constructing a LAG.
- RPVST is outside task 4.09 except as an exact-capability/deferred boundary.
- Standalone CLI persistence follows task 4.02 only after running-state topology verification.
- Rollback restores exact observed global mode/timers/priorities, port settings/protection flags and MST region/instance state;
  never use disable-STP as a generic rollback.
