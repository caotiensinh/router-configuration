fundamental_model:
  logical_segmentation:
    statement: 802.1Q VLAN logically divides a physical switched network into multiple VLAN/broadcast domains.
    source_ids:
      - OMADA_SMART_MANAGED_8021Q_GUI_2026
      - OMADA_CONTROLLER_8021Q_SWITCH_2024
  vlan_identifier:
    normalized_field: VLAN_ID
    published_range:
      min: 1
      max: 4094
    semantics: Each VLAN is identified by its VLAN ID; current Controller guidance describes the VLAN ID as carried in the IEEE 802.1Q tag.
    source_ids:
      - OMADA_AGILE_NEW_VI_USER_GUIDE_2026
      - OMADA_CONTROLLER_USER_GUIDE_V6
  tagged_ingress:
    frame_state: TAGGED_FRAME
    semantics: The switch checks the VID contained in the VLAN tag to determine VLAN membership where the Agile/Easy Managed guide applies.
    source_ids:
      - OMADA_AGILE_NEW_VI_USER_GUIDE_2026
  untagged_ingress:
    frame_state: UNTAGGED_FRAME
    semantics: The applicable Agile/Easy Managed guide inserts/associates a VLAN tag using the ingress port PVID as VID before forwarding in the VLAN context.
    source_ids:
      - OMADA_AGILE_NEW_VI_USER_GUIDE_2026
    boundary: PVID write syntax and access-port configuration are deferred to task 4.05.
  tagged_egress:
    membership_state: TAGGED_MEMBER
    semantics: Traffic for the VLAN exits the member port with VLAN tag information present.
    source_ids:
      - OMADA_SMART_MANAGED_8021Q_GUI_2026
      - OMADA_AGILE_NEW_VI_USER_GUIDE_2026
    boundary: Trunk/tagged write syntax is deferred to task 4.06.
  untagged_egress:
    membership_state: UNTAGGED_MEMBER
    semantics: Traffic for the VLAN exits the member port without the VLAN tag; the applicable Agile/Easy Managed guide states the tag header is removed before sending.
    source_ids:
      - OMADA_SMART_MANAGED_8021Q_GUI_2026
      - OMADA_AGILE_NEW_VI_USER_GUIDE_2026
    boundary: Access-port/PVID and membership write syntax are deferred to tasks 4.05 and 4.07.
  non_member:
    membership_state: NON_MEMBER
    semantics: The port is excluded from the current VLAN in the applicable Agile/Easy Managed guide.
    source_ids:
      - OMADA_AGILE_NEW_VI_USER_GUIDE_2026

source_scoped_defaults_and_limits:
  - id: AGILE_DEFAULT_VLAN_1_BEHAVIOR
    source: OMADA_AGILE_NEW_VI_USER_GUIDE_2026
    scope: Agile/Easy Managed New-VI guide only
    published_behavior:
      - By default all ports are added to VLAN 1.
      - A port can be removed from VLAN 1 only when it is also a member of another VLAN.
      - If a port is removed from all current VLANs, the guide states it is added to VLAN 1 automatically.
      - VLAN 1 cannot be deleted.
    normalization_rule: SOURCE_SCOPED_ONLY_DO_NOT_GENERALIZE_TO_ALL_JETSTREAM
  - id: AGILE_SIMULTANEOUS_VLAN_LIMIT
    source: OMADA_AGILE_NEW_VI_USER_GUIDE_2026
    scope: Agile/Easy Managed guide only
    published_limit: 32
    unit: simultaneous_vlans
    normalization_rule: MODEL_FAMILY_LIMIT_NOT_GLOBAL_SWITCH_LIMIT

