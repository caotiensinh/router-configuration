safe_automation_contract:
  preconditions:
    - Resolve exact model, hardware revision, region, firmware and management mode.
    - Confirm positive 802.1Q support for the exact device and target management plane.
    - Resolve the exact physical/logical port identity before any membership operation.
    - Keep source-scoped VLAN 1/default behavior and VLAN capacity limits attached to their product family.
  read_model:
    - Discover existing VLAN IDs and per-port tagged/untagged/non-member membership using an official applicable read surface.
    - Discover current PVID separately from egress membership; do not assume they are equivalent.
    - Preserve management VLAN and switch-management-IP dependencies for task 4.08 rather than inferring them here.
  mutation_boundary:
    - This task defines concepts only and authorizes no production VLAN write syntax.
    - Access/PVID mutation belongs to 4.05.
    - Tagged/trunk mutation belongs to 4.06.
    - Membership removal/default-VLAN mutation belongs to 4.07.
    - VLAN interface and management-IP mutation belongs to 4.08.
  verification:
    - Concept normalization is VERIFIED only when each asserted behavior is backed by the cited official source and its source scope is retained.
    - Exact device execution remains BLOCKED_BY_APPLICABILITY until later task syntax plus model/firmware/management-mode evidence is resolved.

validation_cases:
  - id: VLAN_ID_RANGE
    expected: Accept concept range 1-4094 only where current official source applies; do not infer per-device usable-count capacity from the numeric namespace.
  - id: TAGGED_UNTAGGED_DISTINCTION
    expected: Tagged and untagged egress remain distinct states; never collapse them into generic membership.
  - id: PVID_IS_NOT_EGRESS_MEMBERSHIP
    expected: PVID is an ingress/default VLAN classification field and must remain separate from tagged/untagged egress membership.
  - id: AGILE_VLAN1_DEFAULT
    expected: Retain VLAN 1 rules only in Agile/Easy Managed scope; do not promote them to all managed switches.
  - id: AGILE_32_VLAN_LIMIT
    expected: Retain 32 simultaneous VLANs only in the source scope; do not use it as a global Omada/JetStream limit.
  - id: CONTROLLER_STANDALONE_SEPARATION
    expected: Do not translate standalone GUI semantics directly into controller objects or vice versa without task-specific evidence.

