rules:
- LLDP, LLDP-MED, Voice VLAN/Auto-VoIP, and neighbor discovery are separate state
  planes.
- Global LLDP enable does not prove per-port transmit/receive state or neighbor discovery.
- CLI lldp med-status enables LLDP-MED on the port and changes port Admin Status to
  Tx&Rx in the cited CLI scope; do not synthesize this side effect in other modes
  without evidence.
- Current 2026 standalone guide says LLDP-MED is disabled by default in its cited
  scope; Controller behavior is version/workflow scoped and must not be generalized.
- LLDP-MED voice deployment depends on explicit Voice VLAN and Auto-VoIP/network-policy
  intent; do not silently create or modify VLAN/PVID/QoS.
- PASS requires configuration read-back plus expected neighbor/local/traffic evidence
  or endpoint behavior where applicable.
- Management address and location TLVs can expose operational information; advertise
  only intended data.
- Persistence follows task 4.02 only after running-state verification; rollback restores
  exact pre-change LLDP/LLDP-MED state.
