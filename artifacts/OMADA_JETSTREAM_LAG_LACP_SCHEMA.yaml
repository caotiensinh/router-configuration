rules:
- Construct member aggregation with the documented channel-group command in the exact applicable interface context; do not substitute unrelated port-channel creation syntax.
- Static mode and LACP active/passive are distinct operational modes and both ends must use a compatible design.
- Current Controller guidance requires the two ends of an aggregation link to use the same LAG mode and recommends one LACP side Active and the other Passive.
- Do not connect all redundant physical links before LAG/LACP is configured and verified when doing so would create a Layer-2 loop.
- Member compatibility is a precondition. Current Controller guidance explicitly calls out matching speed and duplex during troubleshooting; Agile/Easy Managed guidance adds source-scoped requirements including same member count, speed/duplex, flow control and QoS.
- LAG is a logical interface. VLAN/STP/QoS and related configuration may be authoritative on the LAG rather than its physical members in the cited standalone scope; discover and verify the logical-interface state.
- Hashing controls traffic distribution across members and does not prove that one traffic flow can consume the sum of all member bandwidth.
- Operational PASS requires read-back of LAG membership/state and, for LACP, partner/internal protocol state. Command/UI acceptance alone is EXECUTED_UNVERIFIED.
- Range/batch member changes are not assumed atomic; verify every intended member independently.
- A LAG carrying management/controller reachability requires an alternate or recovery path before destructive member/group mutation.
- Standalone CLI persistence follows task 4.02 only after running-state operational verification.
- M-LAG/MLAG is a separate feature and is not normalized as ordinary single-chassis LAG/LACP in task 4.10.
