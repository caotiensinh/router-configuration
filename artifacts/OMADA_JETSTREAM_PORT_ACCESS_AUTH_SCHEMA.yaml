rules:
- Port Security, IEEE 802.1X, MAB/MAC-based authentication, RADIUS and VLAN assignment
  are separate state planes.
- Current 2026 Port Security guidance says Port Security and 802.1X cannot be enabled
  simultaneously on one port.
- Port Security cannot be enabled on a LAG member and a Port-Security-enabled port
  cannot be added to a LAG in the cited current guide.
- 'Controller MAC-Based port method and CLI MAB are related but distinct: MAC-Based
  defines per-client authentication scope, while MAB sends a RADIUS request using
  the client MAC as username and password for non-802.1X clients.'
- Port-Based authentication can authorize other clients on the same port after one
  client succeeds; never use it where per-device identity is required.
- authorized-force and unauthorized-force are explicit administrative port-control
  states, not evidence of an automatic RADIUS-down fail-open/fail-closed policy.
- Current evidence supports RADIUS redundancy and Guest VLAN for failed/timed-out
  authentication, but does not authorize inferring a default allow state when all
  RADIUS servers are unreachable.
- Dynamic VLAN assignment may create/add VLAN membership and change PVID in cited
  CLI scope; this requires explicit cross-feature approval and exact rollback.
- Guest VLAN, NAS ID and some RADIUS security features are Controller/firmware version
  scoped and must not be generalized.
- PASS requires configuration read-back plus actual authorized/unauthorized session
  behavior and healthy management/uplink paths.
