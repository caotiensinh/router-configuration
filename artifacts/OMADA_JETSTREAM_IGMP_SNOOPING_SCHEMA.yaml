rules:
- IGMP Snooping is Layer-2 IPv4 multicast forwarding control; it is not multicast routing/PIM.
- Global, VLAN, and port IGMP Snooping are separate state planes; current standalone guidance enables all three for the cited
  IPTV workflow.
- Do not translate standalone CLI/GUI semantics into Controller objects or vice versa.
- Fast Leave is safe only on positively verified single-receiver edge ports in current hotel IPTV guidance; block on cascaded/shared/downstream-switch/AP
  ports.
- Querier configuration is VLAN-scoped. Current hotel IPTV guidance requires exactly one active querier in the multicast network;
  CLI querier-election is separate and disabled by default in the cited reference.
- Dynamic router-port learning and static router-port configuration are distinct. Manual static router ports are optional
  in the cited hotel topology, not a universal requirement.
- Unknown multicast Forward, Discard, and Router Port First are distinct policies; route-unknown is capability-scoped in the
  CLI reference.
- Report Suppression is separate from Fast Leave and is disabled by default in the cited CLI reference.
- Static multicast-group membership is not evidence of a dynamic listener; verify whether an entry is dynamic or static.
- VLAN membership/tagging/PVID from tasks 4.04-4.08 remains an independent dependency and must be correct before multicast
  forwarding can PASS.
- When a logical LAG carries multicast traffic, task 4.10 logical-interface semantics apply; do not blindly configure physical
  members.
- MLD/IPv6 multicast and MVR are outside task 4.11 and must not be synthesized here.
- Operational PASS requires group-table/router-port/member-port evidence and traffic/reachability verification; command/UI
  acceptance alone is EXECUTED_UNVERIFIED.
- Standalone CLI persistence follows task 4.02 only after running-state verification.
- Rollback restores exact observed pre-change snooping, querier, router-port, unknown-policy, Fast Leave, report-suppression
  and static-group state.
