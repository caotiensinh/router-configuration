authority: TP-Link / Omada official documentation only
scope:
  product_family: Omada / JetStream managed-switch VLAN membership knowledge
  source_scope: Official generic JetStream CLI examples plus current Omada Agile/Easy Managed 802.1Q guidance, Smart/Managed
