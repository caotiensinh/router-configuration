- vlan_id
- port_identity
- membership_state
- egress_rule
- pvid
- default_vlan_state
- management_mode
- pre_change_membership
- pre_change_pvid
- verification_state
- persistence_state
membership_state_enum:
- TAGGED_MEMBER
- UNTAGGED_MEMBER
- NON_MEMBER
- UNKNOWN
operation_enum:
- ADD_TAGGED_MEMBER
- ADD_UNTAGGED_MEMBER
- REMOVE_MEMBER
- CHANGE_MEMBERSHIP_STATE
- REMOVE_VLAN_OBJECT
- READ_MEMBERSHIP
- READ_PVID
verification_state_enum:
- VERIFIED
- EXECUTED_UNVERIFIED
- BLOCKED_BY_APPLICABILITY
- BLOCKED_BY_CAPABILITY
- BLOCKED_BY_PRIVILEGE
- BLOCKED_BY_MANAGEMENT_PATH_RISK
- BLOCKED_BY_DEPENDENCY
- NOT_APPLICABLE
- UNKNOWN
rules:
- Generic JetStream CLI documents switchport general allowed vlan <VLAN_LIST> {tagged|untagged} for membership addition
  and no switchport general allowed vlan <VLAN_LIST> for membership removal.
- Generic JetStream CLI documents no vlan <VLAN_ID> for deleting a VLAN object; object deletion and port-membership
  removal are different operations.
- VLAN 1 removal in the generic CLI example is an explicit separate operation and must never be silently synthesized
  by access/trunk configuration.
- The generic guide statement that ports are generally VLAN-1 members is guidance for that example/scope, not a
  universal exact-device invariant.
- 'Agile/Easy Managed default VLAN-1 behavior is source-scoped: all ports start in VLAN 1, removal from VLAN 1 requires
  membership in another VLAN, removing a port from all current VLANs returns it to VLAN 1, and VLAN 1 cannot be
  deleted.'
- Do not generalize Agile/Easy Managed VLAN-1 rules or its VLAN capacity limits to other switch families.
- PVID is separate from membership. Removing or changing membership does not by itself authorize changing PVID,
  and removing the VLAN referenced by a PVID is blocked until exact applicable behavior/dependency is resolved.
- Membership transitions must be read back as the exact tagged/untagged/non-member state before PASS.
- Management/uplink ports require a verified recovery path before membership removal that could sever reachability.
- Batch/range results require per-port and per-VLAN verification; partial execution is never atomic PASS.
- Rollback restores exact observed pre-change membership and PVID/default state, not assumed VLAN 1 or empty membership.
- Persistence uses the task 4.02 save contract where applicable after running-state verification.
- VLAN interface and switch management IP remain task 4.08.
