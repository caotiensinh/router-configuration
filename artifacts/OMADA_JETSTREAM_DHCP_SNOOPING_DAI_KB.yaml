state_separation:
  manual_binding: IP-MAC-VLAN-port entries explicitly configured by operator intent.
  dynamic_binding: DHCP Snooping learned IP-MAC-VLAN-port-lease evidence.
  dhcp_snooping: DHCP transaction inspection, binding learning and rogue-server response blocking on selected ports.
  dai: ARP validation against binding evidence plus explicit validation/trust/VLAN/rate controls.
  ip_verify_source: Separate source-filter plane; never enabled implicitly by DHCP Snooping or DAI intent.
controller_facts:
  controller_minimum: '6.1+'
  dhcp_snooping:
    - Enable globally under Network Config > Security > IMPB.
    - Select supported switches and intended ports.
    - The cited workflow does not allow selecting the cascade port, protecting DHCP management reachability of the switch.
  dai:
    - Enable globally, then choose intended device/ports.
    - DHCP Snooping learned items can be used as the validation source when Snooping items take effect is enabled.
    - Static-IP-only environments require explicit manual binding entries rather than fabricated DHCP state.
  inseparable_behavior_in_cited_workflow: A DHCP Snooping selected port learns bindings and drops illegal DHCP server response traffic; those two effects cannot be separated in that workflow.
cli_facts:
  dhcp_snooping:
    global: ip dhcp snooping
    vlan: ip dhcp snooping vlan <vlan-range>
    max_entries: ip dhcp snooping max-entries <value>
    trust: ip dhcp snooping trust
    readback: [show ip source binding, show ip dhcp snooping, show ip dhcp snooping interface]
  dai:
    global: ip arp inspection
    validation: 'ip arp inspection validate { src-mac | dst-mac | ip }'
    vlan: ip arp inspection vlan <vlan-list>
    trust: ip arp inspection trust
    rate_limit: ip arp inspection limit-rate <1-300>
    burst_interval: ip arp inspection burst-interval <1-15>
    exceed_action: 'ip arp inspection exceed [ drop | shutdown ] <recover-time>'
    readback: [show ip arp inspection, show ip arp inspection interface, show ip arp inspection vlan, show ip arp inspection statistics]
    cited_defaults:
      limit_rate_pps: 100
      burst_interval_seconds: 1
safety_gates:
  - Exact device applicability and management mode must be proven before command authorization.
  - Snapshot manual bindings, learned-binding policy, trusted ports and enforcement scope before changes.
  - Identify DHCP server/uplink/cascade/routing/LAG paths before enabling enforcement.
  - The CLI explicitly recommends trusted status for uplink/routing/LAG ports before ARP Inspection in its cited scope; do not generalize beyond exact applicability.
  - Never infer a port should be trusted or untrusted from role names alone.
  - Configuration acceptance alone is not PASS.
verification:
  pass_requires:
    - exact configuration readback
    - expected manual or dynamic binding-table contents
    - legitimate DHCP flow where DHCP is used
    - legitimate ARP/IP connectivity
    - rejection evidence for representative rogue-server/spoof traffic where safely testable
    - healthy management/uplink reachability
rollback:
  rule: Restore exact pre-change bindings, trust state, global/VLAN enforcement, validation controls, rate/burst/exceed controls, then verify connectivity before persistence.
