canonical_semantics:
  vlan_interface: Layer-3 interface associated with a VLAN; may be assigned a static address or obtain one through DHCP in
    documented scopes.
  management_interface: The VLAN interface/network used for device management in the applicable management plane; it is not
    automatically every configured SVI.
  separation_rule: VLAN membership/PVID, VLAN-interface IP state, and management-VLAN designation are separate state planes
    and must be discovered/verified independently.
  routing_boundary: Additional SVI creation can introduce L3 forwarding on capable devices. Routing/default-route/static-route
    requirements are dependencies only here; detailed routing remains 4.17.
standalone_cli:
  source_scoped_default:
    interface: VLAN 1 IP interface
    address_mode: DHCP
    fallback_ipv4: 192.168.0.1
    normalization: GENERIC_GUIDE_SCOPE_ONLY_NOT_EXACT_DEVICE_INVARIANT
  read_back:
    command: show ip interface
    required_observations:
    - interface VLAN identity
    - interface up/down and line-protocol state where shown
    - primary IPv4/prefix
    - address origin such as DHCP/static where shown
  static_address:
    sequence:
    - interface vlan <VLAN_ID>
    - ip address <IPv4_ADDRESS> <SUBNET_MASK>
    boundary: Exact command support, VLAN-interface existence/creation semantics, privilege and model capability remain runtime
      gates.
  dhcp_address:
    sequence:
    - interface vlan <VLAN_ID>
    - ip address-alloc dhcp
    boundary: DHCP server reachability must be verified before changing a live management interface.
  new_vlan_interface:
    entry: interface vlan <VLAN_ID>
    examples:
      vlan20_static: 192.168.20.1/24
      vlan30_dhcp: true
    l3_boundary: The generic guide states that IP interfaces on different VLANs can implement inter-VLAN routing in its scope;
      never infer this capability for unmanaged or exact models without positive evidence.
  prompt_boundary: The example page contains prompt-label inconsistencies around VLAN-interface mode. Normalize the documented
    command sequence, not the literal prompt text, and revalidate exact syntax before execution.
controller_mode:
  vlan_interface_workflow:
    applicability_from_guide:
    - Omada Smart switches
    - Omada L2+ switches
    - Omada L3 switches
    - Omada Controller v5.9+
    operations:
    - Create VLAN/network object
    - Enable corresponding VLAN Interface on target switch
    - Choose IP Address Mode such as Static on documented interface
    - Configure DHCP mode only when explicitly required by the design
    routing_dependency: Static routes/default route may be required for internet/off-subnet reachability; detailed route creation
      is deferred to 4.17.
  management_vlan_v6_2:
    controller_minimum: v6.2+
    default_semantics: The cited guide states the management VLAN is the LAN network by default in centrally managed Omada
      SDN Controller.
    custom_workflow:
    - Create the management network/VLAN
    - Enable its VLAN Interface on the switch
    - Enable Management VLAN on that interface
    - Ensure the controller/device uplink tagging/PVID design preserves reachability
    - Allow time for the device to obtain/use its new management IP
    cloud_boundary: The cited guide says Cloud-Based Controller does not require this management-VLAN configuration because
      management and user data are separated; retain that statement only in this guide scope.
  static_ip:
    path: Devices > Switch > Manage Device > Config > VLAN Interface > Management VLAN interface
    mode: Static
    behavior: Once a static IP is assigned in the cited controller workflow, the device no longer requests its address through
      DHCP.
  adoption_preservation:
    scope: Omada Network V6+ with compatible switch firmware; cited guide excludes Omada Agile switches.
    preserved_preconfiguration:
    - Management VLAN and Interface
    - Static IP of the Interface
    - Static routes
    - Native VLAN on the port
    - Port speed
    safety: Never assume preservation when controller/firmware compatibility is unresolved.
management_path_safety:
  preconditions:
  - Resolve exact model/hardware/region/firmware/management mode and L3 capability.
  - Discover current management VLAN/interface, IP mode/address/mask and current reachable management IP.
  - Discover current port tagged/untagged/PVID path carrying management traffic.
  - If changing to DHCP, prove DHCP availability on the target management VLAN.
  - If off-subnet access is required, resolve gateway/static-route dependency without inventing 4.17 syntax.
  - Establish a verified alternate or recovery path before changing live management addressing/VLAN.
  - Obtain production-write approval.
  write:
  - Apply only the intended VLAN-interface or management-IP delta.
  - Do not implicitly change unrelated port VLAN membership/PVID.
  - Do not implicitly add/delete static routes; 4.17 owns route syntax.
  - Do not disable the previous management interface until new-path verification proves recovery is safe unless an exact approved
    workflow explicitly requires coordinated cutover.
  verify:
  - Read back interface address/mode from the applicable management plane.
  - Verify the target management IP is reachable through the intended VLAN/path.
  - Verify controller adoption/heartbeat remains healthy where applicable.
  - Verify old-path removal only if it was explicitly requested and new-path verification already passed.
  - Record EXECUTED_UNVERIFIED rather than PASS if semantic read-back or reachability verification is incomplete.
  persist: For standalone CLI, use the task 4.02 running-to-startup save contract only after the new management path is verified.
rollback:
  required_pre_state:
  - previous management VLAN/interface
  - previous IP mode
  - previous IPv4 address/subnet mask
  - previous reachable management IP
  - previous relevant uplink tagged/untagged/PVID state
  - DHCP availability/lease expectation
  - routing dependency required for management reachability
  policy: Restore the exact observed pre-change management interface/IP/path state. Do not rely on 192.168.0.1 fallback or
    VLAN 1 unless that exact state was observed and applicable.
