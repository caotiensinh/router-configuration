parallel_lane_execution:
  task_manifest: orchestration/OMADA_PHASE4_05_PARALLEL_TASKS.json
  plan: orchestration/OMADA_PHASE4_05_PARALLEL_PLAN.json
  wave_1_read_only_lanes: 9
  wave_2_integration_lanes: 1
  external_worker_processes_claimed: 0
  rule: Parallel research does not grant concurrent write ownership.
canonical_semantics:
  pvid_role: PVID classifies untagged ingress traffic into the VLAN context where the applicable source documents this behavior.
  egress_membership_role: Untagged membership determines that VLAN traffic leaves the port without the 802.1Q tag.
  separation_rule: PVID and untagged membership are separate state fields; a safe access-port workflow verifies both.
standalone_cli:
  documented_common_sequence:
  - Ensure/create the intended VLAN before port assignment.
  - Enter the exact applicable Ethernet interface configuration mode.
  - switchport general allowed vlan <VLAN_ID> untagged
  - switchport pvid <VLAN_ID>
  example:
    vlan_id: 100
    commands:
    - switchport general allowed vlan 100 untagged
    - switchport pvid 100
  read_back:
    command: show interface switchport [<exact-interface>]
    required_observations:
    - PVID
    - VLAN membership
    - Egress-rule for the intended VLAN
  critical_boundary: The generic access-port example does not include removal of VLAN 1 from the access ports. Do not add
    a no-switchport VLAN-1 mutation here; membership/removal/default-VLAN behavior is task 4.07.
  interface_boundary: The cited example uses gigabitEthernet. Command support on Fast/2.5G/10G/other port classes must be
    verified against exact applicable CLI evidence before execution.
  privilege_boundary: The generic example does not publish a normalized RBAC matrix for these VLAN write commands in the page
    text used here. Authenticated privilege and runtime command support remain execution-time gates.
standalone_gui:
  workflow:
  - Create/select the VLAN and assign intended client-facing port(s) as untagged members.
  - Open Port Config and set the PVID to the intended VLAN ID.
  - Apply/save through the documented GUI workflow.
  verification: Re-open/read the VLAN membership and Port Config/PVID state using the exact applicable GUI before PASS.
  boundary: GUI evidence does not authorize CLI syntax and does not establish Controller behavior.
controller_mode:
  documented_access_port_semantics: Controller VLAN workflow lets the administrator select client-facing ports as Access ports
    for the VLAN; the guide's verification/QA describes the client-facing VLAN as native/untagged.
  current_applicability_from_guide:
    switch_classes:
    - Omada Access
    - Omada Access Plus
    - Omada Access Pro
    - Omada Access Max
    - Omada Aggregation
    - Omada Campus
    controller_minimum: v6.0+
  port_settings_v6_2_10: The documented Controller VLAN modes preserve the PVID/native VLAN as untagged; exact mode semantics
    must remain attached to Controller 6.2.10+ evidence rather than copied to standalone CLI.
  verification: Verify Controller port state and endpoint behavior; the official guide verifies a client on the access port
    receives an address from the expected VLAN subnet.
safe_transaction:
  preconditions:
  - Resolve exact model, hardware revision, region, firmware, management mode and port identity.
  - Verify the target VLAN exists in the applicable management plane.
  - Read current PVID and current per-VLAN membership/egress rule.
  - Detect whether the port carries the current management/controller path.
  - Confirm exact command/UI/controller applicability and authenticated privilege.
  - Obtain production-write approval.
  write:
  - Change only the intended untagged membership/PVID delta for the target access VLAN.
  - Do not remove other VLAN memberships unless the explicit task requires it and later-task evidence authorizes it.
  - For CLI, do not add VLAN-1 removal as an implicit access-port step.
  verify:
  - Read back PVID.
  - Read back intended VLAN membership and untagged egress rule.
  - Check operational link/client outcome when the change is expected to preserve service.
  - Record EXECUTED_UNVERIFIED rather than PASS if semantic read-back is unavailable.
