rules:
- QoS classification/trust, mapping/remap, queue selection, scheduling, bandwidth
  controls and Controller QoS rules are separate state planes; do not collapse them
  into one priority field.
- Standalone CLI default trust in the cited 2026 guide is port-priority/untrust, while
  current Controller 6.1 automatically pushes trust DSCP after adoption; management
  mode/version must be resolved before compiling intent.
- 802.1p is an L2 VLAN-tag priority (0..7); DSCP is an IP-header priority (0..63).
  Untagged traffic does not carry 802.1p in the cited standalone explanation.
- The switch exposes eight forwarding queues TC0..TC7; queue mapping and scheduler
  configuration are independent.
- SP can starve lower queues under sustained higher-priority load; WRR uses weights;
  hybrid SP+WRR is supported in cited standalone/controller scopes.
- 'Scheduler scope is model-dependent: some devices configure globally, others per
  interface. Exact model scope is mandatory before writes.'
- CLI qos dscp-remap formal description and syntax text contain an inconsistency;
  preserve the documented command-family evidence and require runtime validation rather
  than inventing syntax.
- Bandwidth Control / storm control are adjacent but distinct from QoS classification.
  Port rate-limit and storm-control conflicts remain source/device scoped and must
  not be silently resolved.
- 'LAG is a logical interface dependency: where QoS applies to port-channel/LAG, do
  not independently mutate members without exact read-back.'
- TCAM/resource priority conflicts can prevent simultaneous features from taking effect;
  configuration acceptance alone is not proof of effective QoS.
- PASS requires read-back of trust/mapping/scheduler/rule state plus traffic/counter
  behavior where observable; Apply/command acceptance alone is EXECUTED_UNVERIFIED.
- Standalone CLI persistence follows task 4.02 only after running-state QoS verification.
- Rollback restores exact observed pre-change trust, mappings, scheduler, weights,
  rate limits and Controller rule bindings; do not reset the whole QoS subsystem generically.
