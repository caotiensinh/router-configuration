schema_version: 1.0.0
schema_id: omada.jetstream_access_port_pvid
task: '4.05'
observed_at: '2026-09-15'
status: VALIDATED_FOR_OFFICIAL_ACCESS_PORT_PVID_SCOPE
authority: TP-Link / Omada official documentation only
scope:
  product_family: Omada / JetStream managed-switch VLAN access-port and PVID knowledge
  source_scope: Official generic JetStream CLI examples plus current standalone Smart/Managed and Omada Controller VLAN guidance.
    Exact model, hardware revision, region, firmware, management mode, port identity/capability, privilege and runtime command
    support remain execution gates.
normalized_fields:
- target_vlan_id
- port_identity
- membership_state
- pvid
- management_mode
- pre_change_membership
- pre_change_pvid
- verification_state
- persistence_state
access_port_contract:
  required_semantic_components:
  - target VLAN exists in applicable management plane
  - target port is an untagged member of the intended VLAN
  - port PVID equals the intended access VLAN where the source/workflow requires that relationship
  forbidden_shortcut: PVID_ONLY_IS_NOT_FULL_ACCESS_PORT_CONFIGURATION
verification_state_enum:
- VERIFIED
- EXECUTED_UNVERIFIED
- BLOCKED_BY_APPLICABILITY
- BLOCKED_BY_CAPABILITY
- BLOCKED_BY_PRIVILEGE
- BLOCKED_BY_MANAGEMENT_PATH_RISK
- NOT_APPLICABLE
- UNKNOWN
rules:
- Keep PVID separate from egress membership; changing one does not prove the other changed.
- For the generic CLI example, access-port configuration uses untagged VLAN membership plus switchport pvid.
- Do not synthesize removal of default VLAN 1 into task 4.05; VLAN membership/removal/default behavior is task 4.07.
- Do not translate standalone CLI or GUI commands into Controller operations, or vice versa.
- Read back both PVID and VLAN membership before declaring PASS.
- If the target port carries the active management path, fail closed until a verified recovery path exists.
- Batch/range changes require per-port verification; partial success is not atomic PASS.
- Running-state success is not reboot durability; persistence uses the task 4.02 save contract where applicable.
- Rollback restores exact observed pre-change PVID and membership state, not an assumed VLAN 1/default state.
- Unmanaged/inventory-only devices are not configuration targets.
