      - ip igmp snooping immediate-leave
      - no ip igmp snooping immediate-leave
      published_contexts:
      - interface gigabitEthernet
      - interface range gigabitEthernet
      - interface port-channel
      - interface range port-channel
      privilege:
      - Admin
      - Operator
      - Power User
  read_back:
    commands:
    - show ip igmp snooping vlan [ <VLAN_ID> ]
    - show ip igmp snooping groups [ vlan <VLAN_ID> ] [ <MULTICAST_ADDR> | count | dynamic | dynamic count | static | static
      count ]
    published_privilege: None
    modes: Privileged EXEC Mode and Any Configuration Mode
    required_observations:
    - global/VLAN/port enable state through applicable management plane
    - querier state and relevant timers/source
    - dynamic/static router-port state where exposed
    - dynamic/static multicast group entries and receiver ports
    - unknown multicast policy
    - Fast Leave and Report Suppression state
    - stream forwarding and required management/controller reachability
standalone_gui:
  guide_scope: How to Configure IGMP Snooping for IPTV Network on L2 Managed Switches Using the New GUI, 2026-08-13; exact
    listed models/revisions only.
  workflow:
  - Create/verify IPTV VLAN and correct tagged/untagged/PVID state.
  - Enable IGMP Snooping globally.
  - Enable IGMP Snooping for the target VLAN.
  - Enable IGMP Snooping on intended receiver/router-facing ports.
  - Save/apply and verify operational multicast membership.
  default_boundary: The guide's example leaves many VLAN parameters at default. Do not promote example defaults to unrelated
    models/firmware.
controller_mode:
  hotel_iptv_2026:
    controller_minimum: v6.0+
    applicability: All Omada switches except Agile switches in the cited guide.
    path: Site View > Network Config > Network Settings > LAN > Multicast Snooping
    unknown_multicast:
      Forward: Flood unknown multicast within the VLAN.
      Discard: Drop unknown multicast packets.
      Router Port First: Forward to static/dynamic router ports if present; otherwise flood within VLAN.
    querier:
      best_practice: The cited hotel IPTV guide says exactly one IGMP Querier should operate in the multicast network.
      placement: Enable on the aggregation switch closest to the multicast source in the cited topology.
      scope_rule: Topology recommendation, not a universal exact-device default.
    report_suppression:
      optional: true
      guidance: Recommended in the cited guide, especially for large IPTV deployments.
    fast_leave:
      port_profile: true
      safe_scope: Only positively verified ports with a single TV/STB behind the port.
      forbidden_examples:
      - switch cascades
      - AP cascades
      - shared downstream ports with multiple receivers
      risk: A Leave from one downstream receiver can immediately remove the shared port and interrupt other receivers watching
        the same group.
    router_port:
      guidance: Automatic router-port selection is normally sufficient in the cited hotel guide; static router port is optional,
        not mandatory.
    verification:
    - Inspect running configuration through Controller.
    - Use Device Terminal to inspect multicast groups.
    - Verify intended receivers can join/leave streams and unrelated ports do not receive unintended traffic.
troubleshooting:
  current_2026:
  - Check multicast-group table stability; group expiry during stable playback indicates a membership/control issue.
  - Verify group member ports correspond to intended receiver-side ports.
  - Verify the router port exists where multicast/queries should enter or leave.
  - Compare receive/forward interface counters repeatedly to identify packet loss; exact counter command spelling is applicability-scoped.
  - If Layer-3 multicast routing is involved, IGMP/PIM/mroute diagnostics are a separate routing plane and are not synthesized
    by 4.11.
safe_transaction:
  preconditions:
  - Resolve exact model, hardware revision, region, firmware, management mode, Controller version and port/LAG identity.
  - Verify the target VLAN and tagged/untagged/PVID path from tasks 4.04-4.08.
  - Read current global/VLAN/port IGMP Snooping state.
  - Read current multicast groups and router ports.
  - Resolve whether a querier already exists and whether querier election is in use.
  - Classify each Fast Leave target as single-receiver edge or shared/cascaded; block unknown/shared targets.
  - Resolve unknown-multicast policy and capability before changing it.
  - Obtain production-write approval.
  write:
  - Apply only the intended IGMP Snooping/Querier/Fast Leave/router-port/report-suppression/unknown-policy delta.
  - Do not synthesize MLD, MVR or PIM.
  - Do not enable Fast Leave on shared/cascaded ports.
  - Do not create a competing querier when an existing querier/election design is unresolved.
  - Do not silently rewrite VLAN/PVID/LAG state.
  verify:
  - Read back configuration in the exact management plane.
  - Verify dynamic/static group entries and receiver ports.
  - Verify router-port/querier state.
  - Verify join/leave behavior and multicast delivery.
  - Check for unintended multicast flooding/drops and packet-loss symptoms.
  - Record EXECUTED_UNVERIFIED rather than PASS if operational membership/forwarding evidence is incomplete.
  persist: For standalone CLI, apply task 4.02 running-to-startup save only after running-state multicast verification.
rollback:
  required_pre_state:
  - global/VLAN/port snooping enable state
  - IGMP version
  - querier state/timers/source/election
  - Fast Leave VLAN/port state
  - Report Suppression
  - unknown multicast policy
  - static/dynamic router-port observations
  - static multicast groups
  - relevant VLAN/LAG path
  policy: Restore exact observed pre-change multicast-control state, then re-verify group formation, forwarding and reachability.
    Do not use blanket disable-IGMP-Snooping as a generic rollback.
validation_cases:
- id: THREE_PLANE_STANDALONE
  expected: PASS only when the applicable standalone workflow has required global/VLAN/port snooping state and operational
    group forwarding is verified.
- id: FAST_LEAVE_SINGLE_STB
  expected: PASS only on positively verified single-receiver edge port with correct leave behavior.
- id: FAST_LEAVE_CASCADE
  expected: BLOCKED_BY_FAST_LEAVE_SAFETY.
- id: NO_QUERIER_AGING
  expected: NOT PASS for a design requiring sustained dynamic membership when no valid querier/election source exists.
- id: COMPETING_QUERIER_UNKNOWN
  expected: BLOCKED_BY_DEPENDENCY until existing querier/election design is resolved.
- id: DROP_UNKNOWN_UNSUPPORTED
  expected: BLOCKED_BY_CAPABILITY if exact device support is unresolved.
- id: ROUTE_UNKNOWN_UNSUPPORTED
  expected: BLOCKED_BY_CAPABILITY; CLI marks route-unknown as only on certain devices.
- id: STATIC_GROUP_ONLY
  expected: Do not treat static membership as proof of dynamic IGMP listener behavior.
- id: WRONG_VLAN_PATH
  expected: NOT PASS even if IGMP state is correct when VLAN/PVID/LAG forwarding path is wrong.
- id: GROUP_TABLE_MISSING
  expected: EXECUTED_UNVERIFIED when configuration is accepted but intended group/member state cannot be observed.
- id: MLD_REQUEST
  expected: DEFER; IPv6 MLD is outside task 4.11.
- id: MVR_REQUEST
  expected: DEFER; MVR is outside task 4.11.
- id: RUNNING_ONLY
  expected: Running-state VERIFIED may remain non-durable until task 4.02 save verification succeeds.
