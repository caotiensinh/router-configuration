concepts:
  igmp_snooping: Layer-2 IPv4 multicast control that learns multicast receiver membership from IGMP control traffic and constrains
    forwarding to intended ports.
  querier: Periodically generates IGMP queries so membership state can be refreshed where the applicable design requires a
    snooping querier.
  fast_leave: Immediately removes a receiving port from a multicast group after a Leave in the applicable scope; unsafe on
    shared/cascaded ports.
  router_port: Port toward a multicast router/querier; may be dynamically learned or statically configured depending on device/workflow.
  report_suppression: Forwards the first report for a group during a query interval and suppresses subsequent duplicate reports
    in the cited CLI scope.
cli_2026:
  evidence_quality:
    parsed_pdf_text: true
    required_screenshot_pages_attempted:
    - 324
    - 328
    - 332
    - 340
    - 352
    screenshot_result: CACHE_MISS_ALL_ATTEMPTS
    visual_screenshot_verified: false
  global:
    enable:
      commands:
      - ip igmp snooping
      - no ip igmp snooping
      mode: Global Configuration Mode
      privilege:
      - Admin
      - Operator
      - Power User
    version:
      syntax: ip igmp snooping version { v1 | v2 | v3 }
      reset: no ip igmp snooping version
      published_default: v3
      behavior:
        v1: process IGMPv1 host messages only
        v2: process IGMPv1/v2 host messages; ignore v3
        v3: process IGMPv1/v2/v3 host messages
    unknown_multicast:
      discard_syntax: ip igmp snooping drop-unknown
      reset: no ip igmp snooping drop-unknown
      published_default: Forward
  vlan:
    enable_and_timers:
      syntax: ip igmp snooping vlan-config <VLAN_LIST> [ rtime <router-time> | mtime <member-time> | ltime <leave-time> ]
      reset: no ip igmp snooping vlan-config <VLAN_LIST> [ rtime | mtime | ltime ]
      vlan_id_range: 1..4094
      router_port_aging_default_seconds: 300
    fast_leave:
      syntax: ip igmp snooping vlan-config <VLAN_LIST> immediate-leave
      reset: no ip igmp snooping vlan-config <VLAN_LIST> immediate-leave
      published_default: disabled
    report_suppression:
      syntax: ip igmp snooping vlan-config <VLAN_LIST> report-suppression
      reset: no ip igmp snooping vlan-config <VLAN_LIST> report-suppression
      published_default: disabled
    static_router_port:
      syntax: ip igmp snooping vlan-config <VLAN_LIST> rport interface { gigabitEthernet <PORT_LIST> | port-channel <PORT_CHANNEL_LIST>
        }
      reset: no ip igmp snooping vlan-config <VLAN_LIST> rport interface { gigabitEthernet <PORT_LIST> | port-channel <PORT_CHANNEL_LIST>
        }
    forbidden_router_port:
      syntax: ip igmp snooping vlan-config <VLAN_LIST> router-ports-forbidd interface { gigabitEthernet <PORT_LIST> | port-channel
        <PORT_CHANNEL_LIST> }
      boundary: Retain vendor spelling exactly; do not silently correct command token.
    static_group:
      syntax: ip igmp snooping vlan-config <VLAN_LIST> static <MULTICAST_IPV4> interface { gigabitEthernet <PORT_LIST> | port-channel
        <PORT_CHANNEL_LIST> }
      reset: no ip igmp snooping vlan-config <VLAN_LIST> static <MULTICAST_IPV4> interface { gigabitEthernet <PORT_LIST> |
        port-channel <PORT_CHANNEL_LIST> }
    querier:
      syntax: ip igmp snooping vlan-config <VLAN_LIST> querier [ max-response-time <1..25> | query-interval <10..300> | general-query
        source-ip <UNICAST_IPV4> | last-member-query-count <1..5> | last-member-query-interval <1..5> ]
      reset: no ip igmp snooping vlan-config <VLAN_LIST> querier [ <parameter> ]
      published_defaults:
        max_response_time_seconds: 10
        query_interval_seconds: 60
        general_query_source_ip: 0.0.0.0
        last_member_query_count: 2
        last_member_query_interval_seconds: 1
      privilege:
      - Admin
      - Operator
      - Power User
      example_anomaly: The PDF example renders 'query interval' while the formal syntax is 'query-interval'; compiler authority
        is the syntax record, with runtime revalidation.
    querier_election:
      syntax: ip igmp snooping vlan-config <VLAN_LIST> querier-election
      reset: no ip igmp snooping vlan-config <VLAN_LIST> querier-election
      published_default: disabled
      robustness:
        syntax: ip igmp snooping vlan-config <VLAN_LIST> querier robustness <1..255>
        published_default: 2
    unknown_multicast:
      discard:
        syntax: ip igmp snooping vlan-config <VLAN_LIST> drop-unknown
        capability_note: CLI reference marks command available only on certain devices.
      router_port_first:
        syntax: ip igmp snooping vlan-config <VLAN_LIST> route-unknown
        meaning: Forward unregistered multicast only to IGMP snooping router ports.
        capability_note: CLI reference marks command available only on certain devices.
  port:
    snooping_enable:
      commands:
      - ip igmp snooping
      - no ip igmp snooping
      published_contexts:
      - interface gigabitEthernet
      - interface range gigabitEthernet
      - interface port-channel
      - interface range port-channel
      privilege:
      - Admin
      - Operator
      - Power User
    fast_leave:
