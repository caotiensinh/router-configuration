rules:
- ACL object/rule definition and ACL binding are separate state planes; an unbound ACL is not treated as effective traffic policy.
- Controller Switch ACL uses ordered first-match processing with implicit Permit All in the cited V6 guide; rule order is part of intended state
  and must be verified.
- Standalone CLI action-stop semantics are independent from Controller ordering semantics. When action-stop is disabled, later matching ACL actions
  may override earlier matches in the cited CLI scope.
- Explicitly record PERMIT or DENY intent even where documentation describes permit as a default; never depend on omitted-action inference.
- MAC, IPv4, Combined, IPv6 and Packet Content ACL ID namespaces are type-specific in the 2026 CLI reference; Packet Content ACL is capability
  scoped.
- Time-range, logging, match masks and binding interfaces are semantic configuration, not presentation metadata.
- Advanced ACL action hooks such as QoS remark/policing, mirroring and PBR redirect are cross-feature dependencies; task 4.12 records their existence
  but does not synthesize detailed 4.13 QoS or 4.17 routing behavior.
- TCAM/SDM ACL resource availability is a production gate. Syntax acceptance or Controller rule creation does not prove hardware entry installation.
- Any ACL affecting switch management, Controller adoption/heartbeat, SSH/HTTPS or the active management VLAN/path requires a verified allow/recovery
  path before deny deployment.
- PASS requires rule/config read-back, binding read-back, resource state, hit/traffic verification where applicable, expected positive and negative
  reachability, and healthy management/controller connectivity.
- Standalone CLI persistence follows task 4.02 only after running-state ACL verification.
- Rollback restores exact observed pre-change ACL objects, rule IDs/order, action-stop state, bindings, related resource/template assumptions
  and management reachability.
