name: CHR VLAN Baseline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chr-vlan-baseline:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'ci(chr-vlan):')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: router-config-chr-vlan-${{ github.ref }}
      cancel-in-progress: false
    env:
      CHR_VERSION: "7.24.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and headless QEMU
        run: |
          set -euo pipefail
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils unzip

      - name: Restore official MikroTik CHR archive cache
        id: chr-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/chr-${{ env.CHR_VERSION }}.img.zip
          key: chr-${{ runner.os }}-${{ env.CHR_VERSION }}

      - name: Prepare official MikroTik CHR image
        run: |
          set -euo pipefail
          archive="/tmp/chr-${CHR_VERSION}.img.zip"
          if [ ! -s "$archive" ]; then
            curl -4 --http1.1 -fL \
              --connect-timeout 15 \
              --max-time 180 \
              --retry 1 \
              --retry-delay 2 \
              --retry-all-errors \
              "https://download.mikrotik.com/routeros/${CHR_VERSION}/chr-${CHR_VERSION}.img.zip" \
              -o "$archive"
          fi
          test -s "$archive"
          unzip -t "$archive"
          unzip -p "$archive" > /tmp/chr-vlan.img
          test -s /tmp/chr-vlan.img
          sha256sum "$archive" > /tmp/chr-vlan-download.sha256

      - name: Persist CHR archive cache before VLAN gate
        if: steps.chr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/chr-${{ env.CHR_VERSION }}.img.zip
          key: chr-${{ runner.os }}-${{ env.CHR_VERSION }}

      - name: Boot disposable three-interface CHR snapshot
        run: |
          set -euo pipefail
          qemu-system-x86_64 \
            -accel tcg,thread=multi \
            -smp 1 \
            -m 256 \
            -snapshot \
            -drive file=/tmp/chr-vlan.img,format=raw,if=virtio \
            -netdev user,id=mgmt,hostfwd=tcp:127.0.0.1:9880-:80 \
            -device virtio-net-pci,netdev=mgmt,mac=52:54:00:12:3c:01 \
            -netdev user,id=trunk \
            -device virtio-net-pci,netdev=trunk,mac=52:54:00:12:3c:02 \
            -netdev user,id=access \
            -device virtio-net-pci,netdev=access,mac=52:54:00:12:3c:03 \
            -display none \
            -serial file:/tmp/chr-vlan-serial.log \
            -daemonize \
            -pidfile /tmp/chr-vlan.pid

      - name: Wait for disposable CHR REST and verify fixture interfaces
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 2 --user 'admin:' \
              http://127.0.0.1:9880/rest/system/resource \
              > /tmp/chr-vlan-resource.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/chr-vlan-serial.log >&2 || true
            exit 1
          fi
          curl -fsS --user 'admin:' http://127.0.0.1:9880/rest/interface \
            > /tmp/chr-vlan-interfaces.json
          python - <<'PY'
          import json
          rows = json.load(open('/tmp/chr-vlan-interfaces.json', encoding='utf-8'))
          names = {str(row.get('name')) for row in rows if isinstance(row, dict)}
          missing = sorted({'ether1', 'ether2', 'ether3'} - names)
          if missing:
              raise SystemExit(f'missing CHR VLAN-fixture interfaces: {missing}')
          print(json.dumps({'ok': True, 'interfaces': sorted(names)}))
          PY

      - name: Validate VLAN dry-run, management survival and exact rollback
        run: |
          set -euo pipefail
          mkdir -p evidence/chr-vlan
          python lab/chr/verify_vlan_baseline.py \
            --admin-url http://127.0.0.1:9880 \
            --output evidence/chr-vlan/vlan-baseline.json

      - name: Preserve VLAN baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chr-vlan-baseline-${{ github.sha }}
          path: |
            evidence/chr-vlan/vlan-baseline.json
            /tmp/chr-vlan-resource.json
            /tmp/chr-vlan-interfaces.json
            /tmp/chr-vlan-download.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable CHR
        if: always()
        run: |
          if [ -f /tmp/chr-vlan.pid ]; then
            kill "$(cat /tmp/chr-vlan.pid)" 2>/dev/null || true
          fi
