name: Cisco C09 Remote Lab Readiness

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact Cisco parent/source commit to probe
        required: true
        type: string
      boundary_json_b64:
        description: Base64 C09 execution-boundary JSON; contains no credentials
        required: true
        type: string
      lab_host_id:
        description: Opaque approved remote lab-host identifier
        required: true
        type: string
      provider:
        description: Remote virtualization provider
        required: true
        type: choice
        options:
          - qemu_kvm
          - proxmox_qemu
      host_attestation_sha256:
        description: Detached approved lab-host attestation SHA-256
        required: true
        type: string
      ssh_port:
        description: Remote SSH port
        required: false
        default: "22"
        type: string
  workflow_call:
    inputs:
      expected_source_sha:
        required: true
        type: string
      boundary_json_b64:
        required: true
        type: string
      lab_host_id:
        required: true
        type: string
      provider:
        required: true
        type: string
      host_attestation_sha256:
        required: true
        type: string
      ssh_port:
        required: false
        default: "22"
        type: string
    secrets:
      C09_REMOTE_LAB_HOST:
        required: true
      C09_REMOTE_LAB_USER:
        required: true
      C09_REMOTE_LAB_KNOWN_HOSTS_B64:
        required: true
      C09_REMOTE_LAB_SSH_KEY_B64:
        required: true

permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
  BOUNDARY_JSON_B64: ${{ inputs.boundary_json_b64 }}
  LAB_HOST_ID: ${{ inputs.lab_host_id }}
  LAB_PROVIDER: ${{ inputs.provider }}
  LAB_HOST_ATTESTATION_SHA256: ${{ inputs.host_attestation_sha256 }}
  C09_REMOTE_LAB_PORT: ${{ inputs.ssh_port }}
  C09_REMOTE_LAB_HOST: ${{ secrets.C09_REMOTE_LAB_HOST }}
  C09_REMOTE_LAB_USER: ${{ secrets.C09_REMOTE_LAB_USER }}
  C09_REMOTE_LAB_KNOWN_HOSTS_B64: ${{ secrets.C09_REMOTE_LAB_KNOWN_HOSTS_B64 }}
  C09_REMOTE_LAB_SSH_KEY_B64: ${{ secrets.C09_REMOTE_LAB_SSH_KEY_B64 }}

jobs:
  remote-readiness:
    if: github.repository == 'caotiensinh/router-configuration'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Guard approved self-hosted runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME}" = "aiserver-router-configuration"
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"

      - name: Validate exact source input
        shell: bash
        run: |
          set -euo pipefail
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_source_sha }}
          persist-credentials: false

      - name: Verify exact checked-out source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EXPECTED_SOURCE_SHA}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        shell: bash
        run: python -m pip install -e .

      - name: Record sanitized secret preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/cisco
          python - <<'PY'
          import hashlib
          import json
          import os

          names = (
              "C09_REMOTE_LAB_HOST",
              "C09_REMOTE_LAB_USER",
              "C09_REMOTE_LAB_KNOWN_HOSTS_B64",
              "C09_REMOTE_LAB_SSH_KEY_B64",
          )
          presence = {name: bool(os.environ.get(name, "").strip()) for name in names}
          missing = [name for name in names if not presence[name]]
          record = {
              "schema_version": "cisco-c09-remote-lab-secret-preflight/1",
              "source_sha": os.environ["EXPECTED_SOURCE_SHA"],
              "required_secret_names": list(names),
              "required_secret_presence": presence,
              "missing_required_secret_names": missing,
              "ready_for_remote_probe": not missing,
              "secret_values_recorded": False,
              "production_write_authorized": False,
          }
          raw = json.dumps(record, sort_keys=True, separators=(",", ":")).encode()
          record["preflight_sha256"] = hashlib.sha256(raw).hexdigest()
          with open("evidence/cisco/c09-remote-lab-secret-preflight.json", "w", encoding="utf-8") as handle:
              json.dump(record, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Enforce secret preflight before SSH access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          record = json.loads(Path("evidence/cisco/c09-remote-lab-secret-preflight.json").read_text(encoding="utf-8"))
          if not record["ready_for_remote_probe"]:
              raise SystemExit("C09 remote-lab preflight blocked; missing=" + ",".join(record["missing_required_secret_names"]))
          PY

      - name: Materialize validated C09 boundary and host contract
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p evidence/cisco "${RUNNER_TEMP}/c09-remote-lab"
          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from router_configuration.vendors.cisco.c09_remote_lab_readiness import build_remote_lab_host_contract

          try:
              raw = base64.b64decode(os.environ["BOUNDARY_JSON_B64"], validate=True)
              boundary = json.loads(raw.decode("utf-8"))
          except Exception as exc:
              raise SystemExit(f"invalid C09 boundary payload: {type(exc).__name__}") from exc
          if boundary.get("source_sha") != os.environ["EXPECTED_SOURCE_SHA"]:
              raise SystemExit("C09 boundary source SHA mismatch")

          contract = build_remote_lab_host_contract(
              boundary,
              lab_host_id=os.environ["LAB_HOST_ID"],
              provider=os.environ["LAB_PROVIDER"],
              host_attestation_sha256=os.environ["LAB_HOST_ATTESTATION_SHA256"],
          )
          path = Path("evidence/cisco/c09-remote-lab-host-contract.json")
          path.write_text(json.dumps(contract, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          os.chmod(path, 0o600)
          PY

      - name: Materialize ephemeral SSH trust and identity files
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "c09-remote-lab"
          root.mkdir(parents=True, exist_ok=True)
          for env_name, filename in (
              ("C09_REMOTE_LAB_KNOWN_HOSTS_B64", "known_hosts"),
              ("C09_REMOTE_LAB_SSH_KEY_B64", "id_c09_lab"),
          ):
              try:
                  data = base64.b64decode(os.environ[env_name], validate=True)
              except Exception as exc:
                  raise SystemExit(f"invalid base64 secret: {env_name}") from exc
              if not data.strip():
                  raise SystemExit(f"empty decoded secret: {env_name}")
              path = root / filename
              path.write_bytes(data)
              os.chmod(path, 0o600)
          PY

      - name: Run fixed read-only remote readiness probe
        id: probe
        shell: bash
        env:
          C09_REMOTE_LAB_KNOWN_HOSTS_FILE: ${{ runner.temp }}/c09-remote-lab/known_hosts
          C09_REMOTE_LAB_IDENTITY_FILE: ${{ runner.temp }}/c09-remote-lab/id_c09_lab
        run: |
          set +e
          python -m router_configuration.vendors.cisco.c09_remote_lab_readiness \
            evidence/cisco/c09-remote-lab-host-contract.json \
            > evidence/cisco/c09-remote-lab-readiness.json
          rc=$?
          echo "probe_rc=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload sanitized readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cisco-c09-remote-lab-readiness-${{ inputs.expected_source_sha }}
          path: |
            evidence/cisco/c09-remote-lab-secret-preflight.json
            evidence/cisco/c09-remote-lab-host-contract.json
            evidence/cisco/c09-remote-lab-readiness.json
          if-no-files-found: warn
          retention-days: 30

      - name: Remove ephemeral SSH material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${RUNNER_TEMP}/c09-remote-lab/known_hosts" "${RUNNER_TEMP}/c09-remote-lab/id_c09_lab"
          rmdir "${RUNNER_TEMP}/c09-remote-lab" 2>/dev/null || true

      - name: Enforce remote host readiness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("evidence/cisco/c09-remote-lab-readiness.json")
          if not path.is_file():
              raise SystemExit("C09 remote-lab readiness evidence missing")
          record = json.loads(path.read_text(encoding="utf-8"))
          if record.get("remote_host_ready") is not True:
              failure = record.get("failure_class") or "remote_host_capability_incomplete"
              raise SystemExit(f"C09 remote lab not ready: {failure}")
          if record.get("production_write_authorized") is not False:
              raise SystemExit("C09 remote readiness crossed production-write boundary")
          PY
