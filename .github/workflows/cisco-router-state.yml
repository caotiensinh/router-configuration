name: Cisco Router Normalized State Contract

on:
  push:
    paths:
      - "src/router_configuration/vendors/cisco/router_state.py"
      - "src/router_configuration/vendors/cisco/data/router_state_catalog.json"
      - "tests/test_cisco_router_state.py"
      - "docs/cisco/ROUTER_NORMALIZED_STATE.md"
      - ".github/workflows/cisco-router-state.yml"
  pull_request:
    paths:
      - "src/router_configuration/vendors/cisco/router_state.py"
      - "src/router_configuration/vendors/cisco/data/router_state_catalog.json"
      - "tests/test_cisco_router_state.py"
      - "docs/cisco/ROUTER_NORMALIZED_STATE.md"
      - ".github/workflows/cisco-router-state.yml"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run C05 normalized router-state contract tests
        run: python -m unittest tests.test_cisco_router_state -v
      - name: Record fail-closed C05 contract evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/cisco
          python - <<'PY'
          import json
          import os
          from router_configuration.vendors.cisco.router_state import load_router_state_catalog, router_state_catalog_digest

          catalog = load_router_state_catalog()
          result = {
              "schema_version": "cisco-c05-contract-evidence/1",
              "source_sha": os.environ["SOURCE_SHA"],
              "stage": "normalized_state_contract_ready_live_state_required",
              "catalog_digest_sha256": router_state_catalog_digest(),
              "required_modules": sorted(item["module"] for item in catalog["observations"]),
              "documentation_trains": sorted(catalog["documentation_trains"]),
              "live_state_observed": False,
              "synthetic_fixture_can_complete_c05": False,
              "c05_complete": False,
              "production_write_authorized": False,
              "physical_device_verified": False,
          }
          with open("evidence/cisco/c05-contract.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - name: Preserve C05 contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: cisco-router-state-contract-${{ env.SOURCE_SHA }}
          path: evidence/cisco/c05-contract.json
          if-no-files-found: error
          retention-days: 30
