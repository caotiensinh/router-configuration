name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q src
      - name: Validate lab shell syntax
        run: sh -n lab/chr/run_readonly_acceptance.sh
      - name: Unit and synthetic integration tests
        run: python -m unittest discover -s tests -v

  chr-live-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'ci(chr):')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CHR_VERSION: "7.24.1"
      CHR_ACCEPTANCE_PROFILE: "secure-populated-technical-gate"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and QEMU
        run: |
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 unzip
      - name: Download official MikroTik CHR image
        run: |
          set -eu
          curl -4 --http1.1 -fL \
            --connect-timeout 15 \
            --max-time 180 \
            --retry 1 \
            --retry-delay 2 \
            --retry-all-errors \
            "https://download.mikrotik.com/routeros/${CHR_VERSION}/chr-${CHR_VERSION}.img.zip" \
            -o /tmp/chr.img.zip
          unzip -p /tmp/chr.img.zip > /tmp/chr.img
          test -s /tmp/chr.img
          sha256sum /tmp/chr.img.zip > /tmp/chr-download.sha256
      - name: Boot isolated CHR in QEMU snapshot mode
        run: |
          set -eu
          qemu-system-x86_64 \
            -accel tcg,thread=multi \
            -smp 1 \
            -m 256 \
            -snapshot \
            -drive file=/tmp/chr.img,format=raw,if=virtio \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:9180-:80,hostfwd=tcp:127.0.0.1:9443-:443 \
            -device virtio-net-pci,netdev=net0 \
            -display none \
            -serial file:/tmp/chr-serial.log \
            -daemonize \
            -pidfile /tmp/chr.pid
      - name: Wait for live RouterOS REST
        run: |
          set -eu
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 2 --user 'admin:' \
              http://127.0.0.1:9180/rest/system/resource \
              > /tmp/chr-resource.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'CHR REST did not become reachable' >&2
            cat /tmp/chr-serial.log >&2 || true
            exit 1
          fi
          cat /tmp/chr-resource.json
      - name: Run basic live read-only discovery
        run: |
          mkdir -p evidence
          python lab/chr/run_ci_live_smoke.py \
            --url http://127.0.0.1:9180 \
            --output evidence/chr-ci-live.json
      - name: Bootstrap disposable secure acceptance context
        run: |
          set -eu
          python lab/chr/bootstrap_secure_acceptance.py \
            --admin-url http://127.0.0.1:9180 \
            --https-url https://127.0.0.1:9443 \
            --ca-output evidence/chr-lab-ca.crt \
            --credentials-output /tmp/chr-reader-credentials.json \
            | tee evidence/chr-secure-bootstrap-summary.json
      - name: Verify dedicated reader cannot write
        run: |
          set -eu
          python lab/chr/verify_reader_write_denied.py \
            --url https://127.0.0.1:9443 \
            --ca-file evidence/chr-lab-ca.crt \
            --credentials-file /tmp/chr-reader-credentials.json \
            --output evidence/chr-reader-boundary.json
      - name: Populate disposable high-value RouterOS surfaces
        run: |
          set -eu
          python lab/chr/populate_acceptance_objects.py \
            --admin-url http://127.0.0.1:9180 \
            | tee evidence/chr-population-summary.json
      - name: Run populated dedicated-reader HTTPS discovery
        run: |
          set -eu
          ROUTEROS_PASSWORD="$(python -c 'import json; print(json.load(open("/tmp/chr-reader-credentials.json"))["password"])')"
          export ROUTEROS_PASSWORD
          export SSL_CERT_FILE="$GITHUB_WORKSPACE/evidence/chr-lab-ca.crt"
          routerctl routeros-discover \
            --url https://127.0.0.1:9443 \
            --username routercfg-reader \
            --output evidence/chr-ci-secure-populated.json
          routerctl routeros-evidence-check \
            --evidence evidence/chr-ci-secure-populated.json
      - name: Verify populated surfaces and secret boundary
        run: |
          set -eu
          python lab/chr/verify_populated_evidence.py \
            --evidence evidence/chr-ci-secure-populated.json \
            | tee evidence/chr-populated-verification.json
      - name: Build machine-only CHR provenance record
        run: |
          set -eu
          python lab/chr/build_ci_provenance_record.py \
            --evidence evidence/chr-ci-secure-populated.json \
            --workflow-sha "$GITHUB_SHA" \
            --image-url "https://download.mikrotik.com/routeros/${CHR_VERSION}/chr-${CHR_VERSION}.img.zip" \
            --image-sha256-file /tmp/chr-download.sha256 \
            --output evidence/chr-ci-machine-provenance.json
          cat evidence/chr-ci-machine-provenance.json
      - name: Evaluate technical acceptance gate
        run: |
          set -eu
          python lab/chr/evaluate_technical_acceptance.py \
            --evidence evidence/chr-ci-secure-populated.json \
            --bootstrap evidence/chr-secure-bootstrap-summary.json \
            --machine-provenance evidence/chr-ci-machine-provenance.json \
            --output evidence/chr-technical-acceptance.json
      - name: Preserve CHR acceptance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chr-live-acceptance-diagnostics-${{ github.sha }}
          path: |
            evidence/chr-ci-live.json
            evidence/chr-ci-secure-populated.json
            evidence/chr-lab-ca.crt
            evidence/chr-secure-bootstrap-summary.json
            evidence/chr-reader-boundary.json
            evidence/chr-population-summary.json
            evidence/chr-populated-verification.json
            evidence/chr-ci-machine-provenance.json
            evidence/chr-technical-acceptance.json
            /tmp/chr-resource.json
            /tmp/chr-serial.log
            /tmp/chr-download.sha256
          if-no-files-found: warn
          retention-days: 14
      - name: Delete ephemeral reader credential file
        if: always()
        run: rm -f /tmp/chr-reader-credentials.json
      - name: Stop CHR
        if: always()
        run: |
          if [ -f /tmp/chr.pid ]; then
            kill "$(cat /tmp/chr.pid)" 2>/dev/null || true
          fi
