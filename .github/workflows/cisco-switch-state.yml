name: Cisco Switch Normalized State Contract

on:
  push:
    paths:
      - "src/router_configuration/vendors/cisco/switch_state.py"
      - "src/router_configuration/vendors/cisco/data/switch_state_catalog.json"
      - "tests/test_cisco_switch_state.py"
      - "docs/cisco/SWITCH_NORMALIZED_STATE.md"
      - ".github/workflows/cisco-switch-state.yml"
  pull_request:
    paths:
      - "src/router_configuration/vendors/cisco/switch_state.py"
      - "src/router_configuration/vendors/cisco/data/switch_state_catalog.json"
      - "tests/test_cisco_switch_state.py"
      - "docs/cisco/SWITCH_NORMALIZED_STATE.md"
      - ".github/workflows/cisco-switch-state.yml"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run C06 normalized switch-state contract tests
        run: python -m unittest tests.test_cisco_switch_state -v
      - name: Record fail-closed C06 contract evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/cisco
          python - <<'PY'
          import json
          import os
          from router_configuration.vendors.cisco.switch_state import (
              load_switch_state_catalog,
              switch_state_catalog_digest,
          )

          catalog = load_switch_state_catalog()
          required_modules = set()
          for observation in catalog["observations"]:
              required_modules.add(observation["module"])
              required_modules.update(observation.get("required_modules", []))

          result = {
              "schema_version": "cisco-c06-contract-evidence/2",
              "source_sha": os.environ["SOURCE_SHA"],
              "stage": "normalized_switch_state_contract_source_bound_live_state_required",
              "catalog_digest_sha256": switch_state_catalog_digest(),
              "required_modules": sorted(required_modules),
              "documentation_trains": sorted(catalog["documentation_trains"]),
              "trunk_state_verified": catalog["trunk_state_verified"],
              "c06_contract_complete": True,
              "live_state_observed": False,
              "synthetic_fixture_can_complete_c06": False,
              "c06_complete": False,
              "production_write_authorized": False,
              "physical_device_verified": False,
          }
          with open("evidence/cisco/c06-contract.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - name: Preserve C06 contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: cisco-switch-state-contract-${{ env.SOURCE_SHA }}
          path: evidence/cisco/c06-contract.json
          if-no-files-found: error
          retention-days: 30
