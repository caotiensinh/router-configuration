name: CHR VLAN Data Plane

on:
  workflow_dispatch:
  push:
    paths:
      - "src/router_configuration/routeros_vlan_renderer.py"
      - "lab/chr/vlan_baseline_core.py"
      - "lab/chr/verify_vlan_data_plane.py"
      - "lab/chr/run_vlan_data_plane_acceptance.sh"
      - "lab/chr/udp_tag_server.py"
      - "lab/chr/udp_flow_probe.py"
      - "tests/test_chr_vlan_data_plane_contract.py"
      - ".github/workflows/chr-vlan-data-plane.yml"

permissions:
  contents: read

jobs:
  chr-vlan-data-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    concurrency:
      group: router-config-chr-vlan-data-plane-${{ github.ref }}
      cancel-in-progress: false
    env:
      CHR_VERSION: "7.24.1"
      CHR_ARCHIVE: /tmp/chr-7.24.1.img.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and VLAN packet lab dependencies
        run: |
          set -euo pipefail
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils unzip iproute2
      - name: Restore official MikroTik CHR archive cache
        id: chr-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CHR_ARCHIVE }}
          key: chr-${{ runner.os }}-${{ env.CHR_VERSION }}
      - name: Download official MikroTik CHR image on cache miss
        if: steps.chr-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -4 --http1.1 -fL --connect-timeout 15 --max-time 180 --retry 1 --retry-delay 2 --retry-all-errors \
            "https://download.mikrotik.com/routeros/${CHR_VERSION}/chr-${CHR_VERSION}.img.zip" -o "${CHR_ARCHIVE}"
      - name: Validate official CHR archive
        run: |
          set -euo pipefail
          test -s "${CHR_ARCHIVE}"
          unzip -t "${CHR_ARCHIVE}" >/dev/null
      - name: Persist verified CHR archive cache
        if: success() && steps.chr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CHR_ARCHIVE }}
          key: chr-${{ runner.os }}-${{ env.CHR_VERSION }}
      - name: Prove tagged VLAN20 forwarding and untagged trunk rejection
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash lab/chr/run_vlan_data_plane_acceptance.sh
      - name: Validate exact-head sanitized VLAN evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("evidence/chr-vlan-data-plane/acceptance.json").read_text(encoding="utf-8"))
          assert payload["ok"] is True
          assert payload["acceptance"] == "PASS"
          assert payload["workflow_sha"] == "${{ github.sha }}"
          assert payload["renderer"]["production_renderer_used"] is True
          assert payload["packet_flow"]["tagged_trunk_to_access"]["success_ratio"] == 1.0
          assert payload["packet_flow"]["untagged_trunk_negative_control"]["success_ratio"] == 0.0
          assert payload["packet_flow"]["untagged_trunk_negative_control"]["blocked_as_expected"] is True
          assert payload["in_band_vlan_data_plane_acceptance"] is True
          assert payload["ingress_filter_negative_control_acceptance"] is True
          assert payload["rollback_digest_restored"] is True
          assert payload["temporary_files_removed"] is True
          assert payload["production_writer_available"] is False
          assert payload["transport_exposed_to_product"] is False
          assert payload["write_authorized"] is False
          assert payload["physical_router_targeted"] is False
          PY
      - name: Preserve VLAN data-plane evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chr-vlan-data-plane-${{ github.sha }}
          path: |
            evidence/chr-vlan-data-plane/prepared.json
            evidence/chr-vlan-data-plane/flow-tagged.json
            evidence/chr-vlan-data-plane/flow-untagged-negative.json
            evidence/chr-vlan-data-plane/acceptance.json
            evidence/chr-vlan-data-plane/chr-resource.json
            evidence/chr-vlan-data-plane/chr-download.sha256
          if-no-files-found: warn
          retention-days: 14
