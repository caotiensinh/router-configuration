name: Cisco C12 Pre-Handover Readiness

on:
  push:
    paths:
      - "src/router_configuration/vendors/cisco/handover_readiness.py"
      - "tests/test_cisco_handover_readiness.py"
      - "docs/cisco/HANDOVER_READINESS.md"
      - ".github/workflows/cisco-handover-readiness.yml"
  pull_request:
    paths:
      - "src/router_configuration/vendors/cisco/handover_readiness.py"
      - "tests/test_cisco_handover_readiness.py"
      - "docs/cisco/HANDOVER_READINESS.md"
      - ".github/workflows/cisco-handover-readiness.yml"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run pre-handover readiness tests
        run: python -m unittest tests.test_cisco_handover_readiness -v
      - name: Record fail-closed readiness contract
        run: |
          set -euo pipefail
          mkdir -p evidence/cisco
          python - <<'PY'
          import json, os
          result = {
              "schema_version": "cisco-c12-pre-handover-contract-status/1",
              "source_sha": os.environ["SOURCE_SHA"],
              "requires_c06_through_c11": True,
              "requires_physical_device_verified": True,
              "ready_for_c12_human_review": False,
              "c12_complete": False,
              "production_writer_available": False,
              "production_write_authorized": False,
          }
          with open("evidence/cisco/c12-pre-handover-contract.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cisco-c12-pre-handover-contract-${{ env.SOURCE_SHA }}
          path: evidence/cisco/c12-pre-handover-contract.json
          if-no-files-found: error
          retention-days: 30
