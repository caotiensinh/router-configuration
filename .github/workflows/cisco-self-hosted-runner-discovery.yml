name: Cisco Self-Hosted Runner Discovery

on:
  push:
    paths:
      - ".github/workflows/cisco-self-hosted-runner-discovery.yml"
      - ".github/workflows/cisco-self-hosted-reusable-diagnostic.yml"

permissions:
  contents: read

jobs:
  discover:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Record non-sensitive runner metadata
        shell: bash
        run: |
          set -euo pipefail
          printf 'RUNNER_NAME=%s\n' "${RUNNER_NAME:-unknown}"
          printf 'RUNNER_OS=%s\n' "${RUNNER_OS:-unknown}"
          printf 'RUNNER_ARCH=%s\n' "${RUNNER_ARCH:-unknown}"
          printf 'GITHUB_ACTOR_ID=%s\n' "${GITHUB_ACTOR_ID:-unknown}"
          printf 'GITHUB_EVENT_NAME=%s\n' "${GITHUB_EVENT_NAME:-unknown}"
          printf 'GITHUB_REPOSITORY=%s\n' "${GITHUB_REPOSITORY:-unknown}"
          printf 'GITHUB_WORKFLOW=%s\n' "${GITHUB_WORKFLOW:-unknown}"
          printf 'GITHUB_WORKFLOW_REF=%s\n' "${GITHUB_WORKFLOW_REF:-unknown}"

      - name: Inspect owner gate capabilities without exposing policy body
        shell: bash
        run: |
          set -euo pipefail
          hook=/etc/github-runner-security/owner_gate.sh
          test -r "$hook"
          stat -c 'HOOK_OWNER=%U HOOK_GROUP=%G HOOK_MODE=%a HOOK_SIZE=%s' "$hook"
          sha256sum "$hook" | awk '{print "HOOK_SHA256=" $1}'
          for token in \
            'github-actions[bot]' \
            '41898282' \
            'GITHUB_ACTOR_ID' \
            'GITHUB_EVENT_NAME' \
            'GITHUB_REPOSITORY' \
            'GITHUB_WORKFLOW' \
            'GITHUB_WORKFLOW_REF' \
            'workflow_dispatch'; do
            if grep -Fq "$token" "$hook"; then
              printf 'HOOK_CONTAINS_%s=true\n' "$(printf '%s' "$token" | tr -c 'A-Za-z0-9' '_')"
            else
              printf 'HOOK_CONTAINS_%s=false\n' "$(printf '%s' "$token" | tr -c 'A-Za-z0-9' '_')"
            fi
          done
          if sudo -n true >/dev/null 2>&1; then
            echo 'PASSWORDLESS_SUDO=true'
          else
            echo 'PASSWORDLESS_SUDO=false'
          fi
          echo 'No hook body, secret value, or device endpoint was emitted.'

      - name: Inspect local Cisco secure-input presence without reading values
        shell: bash
        run: |
          set -euo pipefail
          echo 'LOCAL_CISCO_ENVIRONMENT_NAMES_BEGIN'
          env | sed 's/=.*$//' | grep -E '^(CISCO_|NETCONF_|RESTCONF_|ROUTERCFG_|ROUTER_CONFIGURATION_)' | sort || true
          echo 'LOCAL_CISCO_ENVIRONMENT_NAMES_END'

          for directory in \
            /etc/router-configuration \
            /etc/router_configuration \
            "${HOME}/.config/router-configuration" \
            /opt/github-runners/router-configuration/_secure \
            /opt/github-runners/router-configuration/secure \
            /var/lib/router-configuration; do
            if [ -d "$directory" ]; then
              printf 'SECURE_DIR_EXISTS=true path=%s readable=%s writable=%s\n' \
                "$directory" \
                "$(test -r "$directory" && echo true || echo false)" \
                "$(test -w "$directory" && echo true || echo false)"
              stat -c 'SECURE_DIR_META path=%n owner=%U group=%G mode=%a' "$directory"
            else
              printf 'SECURE_DIR_EXISTS=false path=%s\n' "$directory"
            fi
          done

          for file in \
            /etc/router-configuration/cisco.env \
            /etc/router-configuration/cisco-netconf.env \
            /etc/router-configuration/acceptance.env \
            "${HOME}/.config/router-configuration/cisco.env" \
            /opt/github-runners/router-configuration/_secure/cisco.env \
            /opt/github-runners/router-configuration/_secure/cisco-netconf.env; do
            if [ -f "$file" ]; then
              printf 'SECURE_FILE_EXISTS=true path=%s readable=%s\n' \
                "$file" "$(test -r "$file" && echo true || echo false)"
              stat -c 'SECURE_FILE_META path=%n owner=%U group=%G mode=%a size=%s' "$file"
            else
              printf 'SECURE_FILE_EXISTS=false path=%s\n' "$file"
            fi
          done
          echo 'No environment values or secure-file contents were emitted.'

  reusable-call:
    uses: ./.github/workflows/cisco-self-hosted-reusable-diagnostic.yml
