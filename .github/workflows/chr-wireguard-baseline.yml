name: CHR WireGuard Baseline

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chr-wireguard-baseline:
    if: github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'ci(chr-wireguard):'))
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: router-config-chr-wireguard-main
      cancel-in-progress: false
    env:
      CHR_VERSION: "7.24.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and headless QEMU
        run: |
          set -euo pipefail
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils unzip

      - name: Restore official MikroTik CHR archive cache
        id: chr-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/chr-${{ env.CHR_VERSION }}.img.zip
          key: chr-${{ runner.os }}-${{ env.CHR_VERSION }}

      - name: Prepare official MikroTik CHR image
        run: |
          set -euo pipefail
          archive="/tmp/chr-${CHR_VERSION}.img.zip"
          if [ ! -s "$archive" ]; then
            curl -4 --http1.1 -fL \
              --connect-timeout 15 \
              --max-time 180 \
              --retry 1 \
              --retry-delay 2 \
              --retry-all-errors \
              "https://download.mikrotik.com/routeros/${CHR_VERSION}/chr-${CHR_VERSION}.img.zip" \
              -o "$archive"
          fi
          test -s "$archive"
          unzip -t "$archive"
          unzip -p "$archive" > /tmp/chr-wireguard.img
          test -s /tmp/chr-wireguard.img
          sha256sum "$archive" > /tmp/chr-wireguard-download.sha256

      - name: Persist CHR archive cache before WireGuard gate
        if: steps.chr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/chr-${{ env.CHR_VERSION }}.img.zip
          key: chr-${{ runner.os }}-${{ env.CHR_VERSION }}

      - name: Boot disposable CHR snapshot
        run: |
          set -euo pipefail
          qemu-system-x86_64 \
            -accel tcg,thread=multi \
            -smp 1 \
            -m 256 \
            -snapshot \
            -drive file=/tmp/chr-wireguard.img,format=raw,if=virtio \
            -netdev user,id=mgmt,hostfwd=tcp:127.0.0.1:9580-:80 \
            -device virtio-net-pci,netdev=mgmt,mac=52:54:00:12:39:01 \
            -display none \
            -serial file:/tmp/chr-wireguard-serial.log \
            -daemonize \
            -pidfile /tmp/chr-wireguard.pid

      - name: Wait for CHR REST
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 2 --user 'admin:' \
              http://127.0.0.1:9580/rest/system/resource \
              > /tmp/chr-wireguard-resource.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/chr-wireguard-serial.log >&2 || true
            exit 1
          fi
          curl -fsS --user 'admin:' http://127.0.0.1:9580/rest/interface \
            > /tmp/chr-wireguard-interfaces.json

      - name: Validate deferred-secret WireGuard runtime and exact rollback
        run: |
          set -euo pipefail
          mkdir -p evidence/chr-wireguard
          python lab/chr/verify_wireguard_baseline.py \
            --admin-url http://127.0.0.1:9580 \
            --output evidence/chr-wireguard/wireguard-baseline.json

      - name: Preserve sanitized WireGuard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chr-wireguard-baseline-${{ github.sha }}
          path: |
            evidence/chr-wireguard/wireguard-baseline.json
            /tmp/chr-wireguard-resource.json
            /tmp/chr-wireguard-interfaces.json
            /tmp/chr-wireguard-download.sha256
          if-no-files-found: warn
          retention-days: 14

      - name: Stop disposable CHR
        if: always()
        run: |
          if [ -f /tmp/chr-wireguard.pid ]; then
            kill "$(cat /tmp/chr-wireguard.pid)" 2>/dev/null || true
          fi
