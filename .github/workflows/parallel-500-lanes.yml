name: Parallel 500 Lane Contract

on:
  push:
    paths:
      - "src/router_configuration/parallel_lanes.py"
      - "tests/test_parallel_lanes.py"
      - "orchestration/parallel_lanes_capacity.json"
      - "docs/PARALLEL_500_LANES.md"
      - ".github/workflows/parallel-500-lanes.yml"
  pull_request:
    paths:
      - "src/router_configuration/parallel_lanes.py"
      - "tests/test_parallel_lanes.py"
      - "orchestration/parallel_lanes_capacity.json"
      - "docs/PARALLEL_500_LANES.md"
      - ".github/workflows/parallel-500-lanes.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Run 500-lane scheduler contract tests
        run: python -m unittest tests.test_parallel_lanes -v

      - name: Validate committed lane capacity manifest
        run: |
          python -m router_configuration.parallel_lanes validate-capacity \
            --manifest orchestration/parallel_lanes_capacity.json
