name: Cisco Validation Approval Contract

on:
  push:
    paths:
      - "src/router_configuration/vendors/cisco/desired_state.py"
      - "src/router_configuration/vendors/cisco/validation_approval.py"
      - "src/router_configuration/vendors/cisco/data/desired_state_catalog.json"
      - "tests/test_cisco_desired_state.py"
      - "tests/test_cisco_validation_approval.py"
      - ".github/workflows/cisco-validation-approval.yml"
  pull_request:
    paths:
      - "src/router_configuration/vendors/cisco/desired_state.py"
      - "src/router_configuration/vendors/cisco/validation_approval.py"
      - "src/router_configuration/vendors/cisco/data/desired_state_catalog.json"
      - "tests/test_cisco_desired_state.py"
      - "tests/test_cisco_validation_approval.py"
      - ".github/workflows/cisco-validation-approval.yml"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run C07 and C08 contract tests
        run: |
          python -m unittest tests.test_cisco_desired_state -v
          python -m unittest tests.test_cisco_validation_approval -v
      - name: Reject runtime write and network surfaces
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("src/router_configuration/vendors/cisco/desired_state.py"),
              Path("src/router_configuration/vendors/cisco/validation_approval.py"),
          ]
          forbidden = (
              "ncclient",
              "requests.",
              "socket.",
              "edit_config(",
              "commit(",
              "dispatch(",
              "connect(",
          )
          findings = {}
          for path in paths:
              text = path.read_text(encoding="utf-8")
              hits = [token for token in forbidden if token in text]
              if hits:
                  findings[str(path)] = hits
          if findings:
              raise SystemExit(f"runtime write/network surface found: {findings}")
          PY
      - name: Record fail-closed C08 slice evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/cisco
          python - <<'PY'
          import json
          import os

          result = {
              "schema_version": "cisco-c08-contract-evidence/1",
              "source_sha": os.environ["SOURCE_SHA"],
              "stage": "validation_approval_vertical_slice_ready_more_features_and_acceptance_required",
              "exact_target_binding_required": True,
              "exact_pre_state_binding_required": True,
              "exact_payload_binding_required": True,
              "exact_schema_inventory_binding_required": True,
              "stale_approval_rejected": True,
              "human_approved": False,
              "approval_bound": False,
              "apply_authorized": False,
              "write_authorized": False,
              "c08_complete": False,
              "production_write_authorized": False,
          }
          with open("evidence/cisco/c08-contract.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - name: Preserve C08 contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: cisco-validation-approval-contract-${{ env.SOURCE_SHA }}
          path: evidence/cisco/c08-contract.json
          if-no-files-found: error
          retention-days: 30
