name: CHR WireGuard Handshake V2

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chr-wireguard-handshake-v2:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'ci(chr-wg-flow-v2):') || startsWith(github.event.head_commit.message, 'test(chr-wg-flow-v2):')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: router-config-chr-wg-flow-v2-${{ github.ref }}
      cancel-in-progress: false
    env:
      CHR_VERSION: "7.24.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and WireGuard lab dependencies
        run: |
          set -euo pipefail
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils unzip iproute2 iputils-ping wireguard-tools tcpdump

      - name: Restore official MikroTik CHR archive cache
        id: chr-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/chr-${{ env.CHR_VERSION }}.img.zip
          key: chr-${{ runner.os }}-${{ env.CHR_VERSION }}

      - name: Download official MikroTik CHR archive on cache miss
        if: steps.chr-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          archive="/tmp/chr-${CHR_VERSION}.img.zip"
          curl -4 --http1.1 -fL --connect-timeout 15 --max-time 180 --retry 1 --retry-delay 2 --retry-all-errors \
            "https://download.mikrotik.com/routeros/${CHR_VERSION}/chr-${CHR_VERSION}.img.zip" -o "$archive"
          test -s "$archive"
          unzip -t "$archive" >/dev/null

      - name: Persist verified CHR archive cache
        if: steps.chr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/chr-${{ env.CHR_VERSION }}.img.zip
          key: chr-${{ runner.os }}-${{ env.CHR_VERSION }}

      - name: Prove WireGuard handshake and encrypted packet transfer
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash lab/chr/run_wireguard_handshake_acceptance_v2.sh

      - name: Validate sanitized WireGuard handshake artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("evidence/chr-wireguard-handshake/acceptance.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["ok"] is True
          assert payload["acceptance"] == "PASS"
          assert payload["workflow_sha"] == os.environ["GITHUB_SHA"]
          assert payload["platform"]["version"].startswith("7.24.1")
          assert payload["handshake_acceptance"] is True
          assert payload["encrypted_packet_transfer_acceptance"] is True
          assert payload["negative_control"] == {
              "blocked_before_peer_activation": True,
              "received_packets": 0,
              "requested_packets": 5,
          }
          assert payload["encrypted_packet_transfer"]["requested_packets"] == 20
          assert payload["encrypted_packet_transfer"]["received_packets"] == 20
          assert payload["encrypted_packet_transfer"]["success_ratio"] == 1.0
          assert payload["routeros_peer_after_transfer"]["last_handshake_present"] is True
          assert payload["routeros_peer_after_transfer"]["rx_bytes_positive"] is True
          assert payload["routeros_peer_after_transfer"]["tx_bytes_positive"] is True
          assert payload["routeros_peer_after_transfer"]["current_endpoint_present"] is True
          assert payload["linux_peer_after_transfer"]["latest_handshake_present"] is True
          assert payload["linux_peer_after_transfer"]["rx_bytes_positive"] is True
          assert payload["linux_peer_after_transfer"]["tx_bytes_positive"] is True

          renderer = payload["renderer"]
          assert renderer["production_renderer_used"] is True
          assert renderer["template_count"] == 4
          assert renderer["deferred_secret_binding"] is True
          assert renderer["secrets_resolved_by_product"] is False
          assert renderer["transport_present"] is False
          assert renderer["apply_available"] is False
          assert renderer["write_authorized"] is False

          secrets = payload["lab_secret_binding"]
          assert secrets["ephemeral_private_key_used"] is True
          assert secrets["ephemeral_private_key_recorded"] is False
          assert secrets["private_key_serialized_to_evidence"] is False
          assert secrets["preshared_key_used"] is False
          assert payload["private_key_recorded"] is False
          assert payload["private_key_serialized"] is False
          assert payload["preshared_key_used"] is False
          assert payload["rollback_digest_restored"] is True
          assert payload["lab_setup_cleanup_restored"] is True
          assert payload["temporary_files_removed"] is True
          assert payload["management_rest_reachable_after_transfer"] is True
          assert payload["production_writer_available"] is False
          assert payload["transport_exposed_to_product"] is False
          assert payload["write_authorized"] is False
          assert payload["physical_router_targeted"] is False

          rendered = json.dumps(payload, sort_keys=True).lower()
          for forbidden in ("private-key", "private_key_value", "password", "token", ".backup", "preshared-key"):
              assert forbidden not in rendered, forbidden
          print(json.dumps({
              "acceptance": payload["acceptance"],
              "workflow_sha": payload["workflow_sha"],
              "negative_received": payload["negative_control"]["received_packets"],
              "positive_received": payload["encrypted_packet_transfer"]["received_packets"],
              "handshake_acceptance": payload["handshake_acceptance"],
              "rollback_digest_restored": payload["rollback_digest_restored"],
          }, indent=2, sort_keys=True))
          PY

      - name: Preserve sanitized WireGuard handshake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chr-wireguard-handshake-v2-${{ github.sha }}
          path: |
            evidence/chr-wireguard-handshake/acceptance.json
            evidence/chr-wireguard-handshake/handshake-transport-diagnostic.json
            evidence/chr-wireguard-handshake/negative-probe.json
            evidence/chr-wireguard-handshake/positive-probe.json
            evidence/chr-wireguard-handshake/linux-wg-stats.json
            evidence/chr-wireguard-handshake/chr-resource.json
            evidence/chr-wireguard-handshake/chr-interfaces.json
            evidence/chr-wireguard-handshake/chr-download.sha256
          if-no-files-found: warn
          retention-days: 14
