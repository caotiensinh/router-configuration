name: CHR Transaction Management Survival

on:
  workflow_dispatch:
  push:
    paths:
      - "src/router_configuration/transaction_*.py"
      - "lab/chr/verify_transaction_management_survival.py"
      - "lab/chr/verify_transaction_runtime_admission.py"
      - "lab/chr/verify_mutation_rollback.py"
      - "lab/chr/verify_render_dry_run.py"
      - "lab/chr/verify_render_dry_run_chunked.py"
      - "lab/chr/build_renderer_syntax_fixture.py"
      - "tests/test_chr_transaction_management_survival_contract.py"
      - ".github/workflows/chr-transaction-management-survival.yml"

permissions:
  contents: read

jobs:
  chr-transaction-management-survival:
    concurrency:
      group: router-config-chr-transaction-management-survival-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHR_VERSION: "7.24.1"
      CHR_ARCHIVE: /tmp/chr-7.24.1.img.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and QEMU
        run: |
          set -euo pipefail
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils unzip
      - name: Restore official MikroTik CHR archive cache
        id: chr-cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/chr-${{ env.CHR_VERSION }}.img.zip
          key: chr-${{ runner.os }}-${{ env.CHR_VERSION }}
      - name: Download official MikroTik CHR image on cache miss
        if: steps.chr-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -4 --http1.1 -fL \
            --connect-timeout 15 \
            --max-time 180 \
            --retry 1 \
            --retry-delay 2 \
            --retry-all-errors \
            "https://download.mikrotik.com/routeros/${CHR_VERSION}/chr-${CHR_VERSION}.img.zip" \
            -o "$CHR_ARCHIVE"
      - name: Prepare official CHR image
        run: |
          set -euo pipefail
          test -s "$CHR_ARCHIVE"
          sha256sum "$CHR_ARCHIVE" > /tmp/chr-download.sha256
          unzip -p "$CHR_ARCHIVE" > /tmp/chr.img
          test -s /tmp/chr.img
      - name: Persist verified CHR archive cache
        if: success() && steps.chr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/chr-${{ env.CHR_VERSION }}.img.zip
          key: chr-${{ runner.os }}-${{ env.CHR_VERSION }}
      - name: Boot isolated CHR in QEMU snapshot mode
        run: |
          set -euo pipefail
          qemu-system-x86_64 \
            -accel tcg,thread=multi \
            -smp 1 \
            -m 256 \
            -snapshot \
            -drive file=/tmp/chr.img,format=raw,if=virtio \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:9680-:80 \
            -device virtio-net-pci,netdev=net0 \
            -netdev user,id=net1 \
            -device virtio-net-pci,netdev=net1 \
            -netdev user,id=net2 \
            -device virtio-net-pci,netdev=net2 \
            -display none \
            -serial file:/tmp/chr-transaction-management-survival-serial.log \
            -daemonize \
            -pidfile /tmp/chr-transaction-management-survival.pid
      - name: Wait for disposable CHR REST
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS --max-time 2 --user 'admin:' \
              http://127.0.0.1:9680/rest/system/resource \
              > /tmp/chr-transaction-management-survival-resource.json; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo 'Disposable CHR REST did not become reachable' >&2
            cat /tmp/chr-transaction-management-survival-serial.log >&2 || true
            exit 1
          fi
          curl -fsS --max-time 2 --user 'admin:' \
            http://127.0.0.1:9680/rest/interface \
            > /tmp/chr-transaction-management-survival-interfaces.json
      - name: Prove management survival during admitted apply
        run: |
          set -euo pipefail
          mkdir -p evidence
          python lab/chr/verify_transaction_management_survival.py \
            --admin-url http://127.0.0.1:9680 \
            --workflow-sha "$GITHUB_SHA" \
            --output evidence/chr-transaction-management-survival.json
      - name: Validate sanitized management-survival artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("evidence/chr-transaction-management-survival.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["ok"] is True
          assert payload["acceptance"] == "PASS"
          assert payload["workflow_sha"] == "${{ github.sha }}"
          assert payload["management_survival_during_apply_claimed"] is True
          assert payload["management_survival_after_apply_claimed"] is True
          assert payload["post_apply_verification_claimed"] is False
          assert payload["routed_data_plane_claimed"] is False
          assert payload["recovery_verification_claimed"] is False
          assert payload["production_timing_claimed"] is False
          assert payload["lifecycle"]["phase"] == "verified"

          instrumentation = payload["instrumentation"]
          assert instrumentation["lab_only"] is True
          assert instrumentation["rendered_command_count"] == 38
          assert instrumentation["rendered_commands_modified"] is False
          assert instrumentation["rendered_command_order_modified"] is False
          assert instrumentation["production_timing_claimed"] is False

          survival = payload["management_survival"]
          assert survival["independent_rest_session"] is True
          assert survival["failure_count"] == 0
          assert survival["all_probes_successful"] is True
          assert survival["mutation_visible_during_apply"] is True
          assert survival["management_interface"] == "ether1"
          assert survival["management_interface_running_all_probes"] is True
          assert survival["phase_success_counts"]["pre_apply"] >= 3
          assert survival["phase_success_counts"]["during_apply"] >= 8
          assert survival["phase_success_counts"]["post_apply"] >= 3
          assert survival["raw_routeros_payload_recorded"] is False
          assert survival["secret_values_present"] is False

          assert payload["lab_cleanup"]["completed"] is True
          assert payload["lab_cleanup"]["baseline_digest_restored"] is True
          assert payload["lab_cleanup"]["changes_transaction_lifecycle"] is False
          assert payload["operator_attestation_claimed"] is False
          assert payload["production_writer_available"] is False
          assert payload["transport_exposed_to_product"] is False
          assert payload["physical_router_targeted"] is False
          assert payload["production_allowed"] is False
          assert payload["write_authorized"] is False

          rendered = json.dumps(payload, sort_keys=True).lower()
          for forbidden in ("private_key", "password", "token", ".backup"):
              assert forbidden not in rendered, forbidden
          print(json.dumps({
              "acceptance": payload["acceptance"],
              "workflow_sha": payload["workflow_sha"],
              "transaction_id": payload["transaction"]["transaction_id"],
              "sample_count": survival["sample_count"],
              "phase_success_counts": survival["phase_success_counts"],
              "mutation_visible_during_apply": survival["mutation_visible_during_apply"],
              "cleanup_baseline_sha256": payload["lab_cleanup"]["cleanup_state_sha256"],
          }, indent=2, sort_keys=True))
          PY
      - name: Preserve sanitized management-survival evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chr-transaction-management-survival-${{ github.sha }}
          path: |
            evidence/chr-transaction-management-survival.json
            /tmp/chr-transaction-management-survival-resource.json
            /tmp/chr-transaction-management-survival-interfaces.json
            /tmp/chr-download.sha256
          if-no-files-found: warn
          retention-days: 14
      - name: Stop disposable CHR
        if: always()
        run: |
          if [ -f /tmp/chr-transaction-management-survival.pid ]; then
            kill "$(cat /tmp/chr-transaction-management-survival.pid)" 2>/dev/null || true
          fi
