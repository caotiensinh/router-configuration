name: CHR WireGuard Handshake

on:
  workflow_dispatch:
  push:
    paths:
      - "src/router_configuration/routeros_wireguard_renderer.py"
      - "lab/chr/verify_wireguard_handshake.py"
      - "lab/chr/diagnose_wireguard_handshake.py"
      - "lab/chr/run_wireguard_handshake_acceptance.sh"
      - "lab/chr/udp_tag_server.py"
      - "lab/chr/udp_flow_probe.py"
      - "tests/test_chr_wireguard_handshake_contract.py"
      - ".github/workflows/chr-wireguard-handshake.yml"

permissions:
  contents: read

jobs:
  chr-wireguard-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    concurrency:
      group: router-config-chr-wireguard-handshake-${{ github.ref }}
      cancel-in-progress: false
    env:
      CHR_VERSION: "7.24.1"
      CHR_ARCHIVE: /tmp/chr-7.24.1.img.zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project and two-CHR packet lab dependencies
        run: |
          set -euo pipefail
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils unzip iproute2

      - name: Restore official MikroTik CHR archive cache
        id: chr-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CHR_ARCHIVE }}
          key: chr-${{ runner.os }}-${{ env.CHR_VERSION }}

      - name: Download official MikroTik CHR image on cache miss
        if: steps.chr-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -4 --http1.1 -fL \
            --connect-timeout 15 \
            --max-time 180 \
            --retry 1 \
            --retry-delay 2 \
            --retry-all-errors \
            "https://download.mikrotik.com/routeros/${CHR_VERSION}/chr-${CHR_VERSION}.img.zip" \
            -o "${CHR_ARCHIVE}"

      - name: Validate official CHR archive
        run: |
          set -euo pipefail
          test -s "${CHR_ARCHIVE}"
          unzip -t "${CHR_ARCHIVE}" >/dev/null

      - name: Persist verified CHR archive cache
        if: success() && steps.chr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CHR_ARCHIVE }}
          key: chr-${{ runner.os }}-${{ env.CHR_VERSION }}

      - name: Prove RouterOS-to-RouterOS handshake and encrypted LAN packet transfer
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          bash lab/chr/run_wireguard_handshake_acceptance.sh

      - name: Validate exact-head sanitized WireGuard acceptance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("evidence/chr-wireguard-handshake")
          configured = json.loads((root / "configured.json").read_text(encoding="utf-8"))
          acceptance = json.loads((root / "acceptance.json").read_text(encoding="utf-8"))
          cleanup = json.loads((root / "cleanup.json").read_text(encoding="utf-8"))
          assert configured["ok"] is True
          assert configured["workflow_sha"] == "${{ github.sha }}"
          assert configured["renderer"]["production_renderer_used_on_chr_a"] is True
          assert configured["renderer"]["template_count"] == 4
          assert configured["renderer"]["secrets_resolved_in_plan"] is False
          assert configured["renderer"]["transport_present"] is False
          assert configured["renderer"]["apply_available"] is False
          assert configured["renderer"]["write_authorized"] is False
          assert configured["key_boundary"]["private_key_recorded"] is False
          assert configured["key_boundary"]["private_key_serialized"] is False
          assert configured["key_boundary"]["preshared_key_used"] is False
          assert configured["key_boundary"]["chr_b_private_key_read"] is False
          assert acceptance["ok"] is True
          assert acceptance["acceptance"] == "PASS"
          assert acceptance["workflow_sha"] == "${{ github.sha }}"
          assert acceptance["packet_flow"]["success_ratio"] == 1.0
          assert acceptance["packet_flow"]["observed_tags"] == {"WG": acceptance["packet_flow"]["requested_flows"]}
          assert acceptance["wireguard_handshake_acceptance"] is True
          assert acceptance["encrypted_packet_transfer_acceptance"] is True
          assert acceptance["chr_a_peer"]["last_handshake_present"] is True
          assert acceptance["chr_b_peer"]["last_handshake_present"] is True
          assert acceptance["chr_a_peer"]["rx_bytes"] > 0 and acceptance["chr_a_peer"]["tx_bytes"] > 0
          assert acceptance["chr_b_peer"]["rx_bytes"] > 0 and acceptance["chr_b_peer"]["tx_bytes"] > 0
          assert cleanup["ok"] is True
          assert cleanup["chr_a_digest_restored"] is True
          assert cleanup["chr_b_digest_restored"] is True
          assert cleanup["temporary_files_removed"] is True
          for payload in (configured, acceptance, cleanup):
              assert payload["production_writer_available"] is False
              assert payload["transport_exposed_to_product"] is False
              assert payload["write_authorized"] is False
              assert payload["physical_router_targeted"] is False
          PY

      - name: Scan WireGuard artifacts for secret values
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          texts = []
          for path in Path("evidence/chr-wireguard-handshake").glob("*.json"):
              texts.append(path.read_text(encoding="utf-8", errors="replace"))
          text = "\n".join(texts)
          forbidden_literals = (
              "__ROUTERCFG_WG_PRIVATE_KEY__",
              '"private-key"',
              '"private_key":"',
              '"preshared-key"',
              "BEGIN PRIVATE KEY",
              "ROUTERCFG_CHR_SYNTHETIC_WG_PRIVATE_KEY",
          )
          hits = [item for item in forbidden_literals if item in text]
          assert not hits, hits
          assert not re.search(r'(?i)private[^\n]{0,24}[=:]\s*"?[A-Za-z0-9+/]{43}="?', text)
          PY

      - name: Preserve WireGuard handshake evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chr-wireguard-handshake-${{ github.sha }}
          path: |
            evidence/chr-wireguard-handshake/configured.json
            evidence/chr-wireguard-handshake/flow.json
            evidence/chr-wireguard-handshake/diagnostic-pre-flow.json
            evidence/chr-wireguard-handshake/diagnostic-post-flow.json
            evidence/chr-wireguard-handshake/acceptance.json
            evidence/chr-wireguard-handshake/cleanup.json
            evidence/chr-wireguard-handshake/chr-a-resource.json
            evidence/chr-wireguard-handshake/chr-b-resource.json
            evidence/chr-wireguard-handshake/chr-download.sha256
          if-no-files-found: warn
          retention-days: 14
