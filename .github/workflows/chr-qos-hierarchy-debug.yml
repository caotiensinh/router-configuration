name: CHR QoS Hierarchy Debug Matrix

on:
  push:
    paths:
      - "lab/chr/debug_qos_hierarchy_paths.py"
      - "lab/chr/run_qos_hierarchy_debug_lane.sh"
      - "tests/test_chr_qos_hierarchy_debug_contract.py"
      - ".github/workflows/chr-qos-hierarchy-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chr-qos-hierarchy-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        lane:
          - prod-dscp-global-single
          - prerouting-port-interface-single
          - port-global-hierarchy
          - prod-dscp-global-hierarchy
          - prerouting-dscp-global-hierarchy
    env:
      CHR_VERSION: "7.24.1"
      CHR_ARCHIVE: /tmp/chr-7.24.1.img.zip
      EVIDENCE_DIR: ${{ github.workspace }}/evidence/chr-qos-hierarchy-debug
      FLOW_COUNT: "80"
      FLOW_TIMEOUT: "0.30"
      DEBUG_LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install disposable CHR hierarchy debug dependencies
        run: |
          set -euo pipefail
          python -m pip install -e .
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils unzip iproute2
          sudo -n true
      - name: Restore official MikroTik CHR archive cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/chr-${{ env.CHR_VERSION }}.img.zip
          key: chr-${{ runner.os }}-${{ env.CHR_VERSION }}
      - name: Run hierarchy or attachment debug lane
        run: bash lab/chr/run_qos_hierarchy_debug_lane.sh
      - name: Preserve sanitized hierarchy debug evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chr-qos-hierarchy-debug-${{ matrix.lane }}-${{ github.sha }}
          path: |
            evidence/chr-qos-hierarchy-debug/*.json
            evidence/chr-qos-hierarchy-debug/chr-download.sha256
          if-no-files-found: warn
          retention-days: 14
