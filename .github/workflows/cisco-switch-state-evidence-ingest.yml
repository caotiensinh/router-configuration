name: Cisco Switch State Evidence Ingest Contract

on:
  push:
    paths:
      - "src/router_configuration/vendors/cisco/switch_state_evidence_ingest.py"
      - "tests/test_cisco_switch_state_evidence_ingest.py"
      - "docs/cisco/SWITCH_STATE_EVIDENCE_INGEST.md"
      - ".github/workflows/cisco-switch-state-evidence-ingest.yml"
  pull_request:
    paths:
      - "src/router_configuration/vendors/cisco/switch_state_evidence_ingest.py"
      - "tests/test_cisco_switch_state_evidence_ingest.py"
      - "docs/cisco/SWITCH_STATE_EVIDENCE_INGEST.md"
      - ".github/workflows/cisco-switch-state-evidence-ingest.yml"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run C06 switch-state evidence-ingest tests
        run: python -m unittest tests.test_cisco_switch_state_evidence_ingest -v
      - name: Record non-promoting C06 ingest status
        run: |
          set -euo pipefail
          mkdir -p evidence/cisco
          python - <<'PY'
          import json, os
          result = {
              "schema_version": "cisco-c06-switch-state-ingest-contract-status/1",
              "source_sha": os.environ["SOURCE_SHA"],
              "candidate_live_read_ingest_ready": True,
              "synthetic_fixture_can_complete_c06": False,
              "repository_live_evidence_accepted": False,
              "c06_complete": False,
              "physical_device_verified": False,
              "production_write_authorized": False,
          }
          with open("evidence/cisco/c06-switch-state-ingest-contract.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cisco-c06-switch-state-ingest-contract-${{ env.SOURCE_SHA }}
          path: evidence/cisco/c06-switch-state-ingest-contract.json
          if-no-files-found: error
          retention-days: 30
