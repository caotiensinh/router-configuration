name: Cisco IOS XE Virtual Lab Contract

on:
  push:
    paths:
      - "src/router_configuration/vendors/cisco/virtual_lab_acceptance.py"
      - "src/router_configuration/vendors/cisco/data/official_sources.json"
      - "tests/test_cisco_virtual_lab_acceptance.py"
      - "docs/cisco/IOSXE_VIRTUAL_LAB.md"
      - ".github/workflows/cisco-iosxe-virtual-lab.yml"
  pull_request:
    paths:
      - "src/router_configuration/vendors/cisco/virtual_lab_acceptance.py"
      - "src/router_configuration/vendors/cisco/data/official_sources.json"
      - "tests/test_cisco_virtual_lab_acceptance.py"
      - "docs/cisco/IOSXE_VIRTUAL_LAB.md"
      - ".github/workflows/cisco-iosxe-virtual-lab.yml"

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Run C07-C09 contract chain
        run: |
          set -euo pipefail
          python -m unittest tests.test_cisco_desired_state -v
          python -m unittest tests.test_cisco_validation_approval -v
          python -m unittest tests.test_cisco_virtual_lab_acceptance -v

      - name: Reject embedded Cisco images and runtime transports
        run: |
          set -euo pipefail
          if git ls-files | grep -Ei '(^|/)(cisco|iosxe|c8kv).*[.](qcow2|iso|ova|vmdk)$'; then
            echo "Cisco proprietary virtual-appliance image found in repository"
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path("src/router_configuration/vendors/cisco/virtual_lab_acceptance.py")
          text = path.read_text(encoding="utf-8")
          forbidden = (
              "import ncclient",
              "from ncclient",
              "import paramiko",
              "from paramiko",
              "import requests",
              "import socket",
              "import subprocess",
              "edit_config(",
              "commit(",
              "connect(",
          )
          found = [token for token in forbidden if token in text]
          if found:
              raise SystemExit(f"C09 evidence bridge contains runtime transport/write surface: {found}")
          PY

      - name: Record contract-only C09 evidence
        run: |
          set -euo pipefail
          mkdir -p evidence/cisco
          python - <<'PY'
          import json
          import os
          from router_configuration.vendors.cisco.virtual_lab_acceptance import contract_only_status

          result = contract_only_status()
          result["source_sha"] = os.environ["SOURCE_SHA"]
          result["stage"] = "virtual_lab_contract_ready_live_iosxe_evidence_required"
          with open("evidence/cisco/c09-contract.json", "w", encoding="utf-8") as handle:
              json.dump(result, handle, indent=2, sort_keys=True)
              handle.write("\n")
          PY

      - name: Verify CI cannot claim live C09 acceptance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("evidence/cisco/c09-contract.json").read_text(encoding="utf-8"))
          assert result["synthetic_fixture_can_complete_c09"] is False
          assert result["live_virtual_iosxe_observed"] is False
          assert result["c09_complete"] is False
          assert result["physical_hardware_claimed"] is False
          assert result["production_writer_available"] is False
          assert result["production_write_authorized"] is False
          PY

      - name: Preserve C09 contract evidence
        uses: actions/upload-artifact@v4
        with:
          name: cisco-iosxe-virtual-lab-contract-${{ env.SOURCE_SHA }}
          path: evidence/cisco/c09-contract.json
          if-no-files-found: error
          retention-days: 30
